        -   id: waden_news_request
            categories: ["nazur_orb"]
            sender_email: emilos.loakim
            recipient_emails: waden
            subject: "Wassup?"
            body: |

                Greetings, my boy!

                So, what have your little investigations into Roly-Poly turned up? Anything big on the horizon? You know Lolo is getting just as impatient as I am.

                If you need any extra equipment, don't hesitate to tell us; we can have it delivered to a friend of mine, near Faeran town centre.

                See you soon,

                Emilos

        -   id: misc_news_emilos
            gamemaster_hints: "Assorted clues for the Alpha Orb."
            categories: ["doctor_honoris_causa", "nazur_orb"]
            sender_email: emilos.loakim
            recipient_emails: loyd.georges
            subject: "Re: Assorted news"
            body: |

                Sorry for the delay, old bean,

                I've had very short nights myself, what with everything that's going on. I had planned a little trip to Nalavut to say hello to my Cynthia and enjoy the festivities, but it looks like that will have to wait for another year.

                Alas, I still have no news from Waden, but knowing him, he won't be in touch until he has something solid and precise... I'll send him a message by Friday, but whatever you do, don't make any rash statements in the meantime, because for now we have no guarantee that this "thing" isn't a *fake*.

                See you soon,

                *Emilos*



        -   "id": waden_report_orb_analysis
            "body": |
                hello,

                here, as requested yesterday, is a little recap of my current analysis of the "thing"; I can't wait
                to get back to the academy to study this little treasure in calmer surroundings, and with more
                sophisticated equipment.

                Happy reading,

                *waden*

                -----

                With a refractive index of 1 (which therefore makes it transparent to many optical/wave phenomena),
                zero magnetism, perfect conductivity, prodigious phosphorescence, an extremely solid crystallographic
                structure that nonetheless thwarts every attempt at observation, and an equally mysterious chemical
                composition, this stone clearly defies all classification! This gem most probably
                does not come from our planet.

                What also seems established is that all the "magical" properties that popular tradition
                attributes to giant crystals are disproved by this gem. It is entirely transparent
                to electromagnetic waves and does not even have the interference or focusing properties
                of existing crystals. No risk, then, of setting off chain reactions by stimulating it.

                The most intriguing thing is that high-pitched, crystalline whistling which the gem emits as soon as its temperature
                rises above the freezing point of water. Under the lasers, the din sometimes becomes quite terrifying;
                lucky this lab is well soundproofed. That must be the "song of the orbs" that
                mythology speaks of.
            "categories": ["doctor_honoris_causa", "nazur_orb"]
            "gamemaster_hints": ""
            "recipient_emails":
            - >-
                loyd.georges@anthropia.pg
            - >-
                emilos.loakim@anthropia.pg
            "sender_email": >-
                waden@anthropia.pg
            "subject": >-
                Roly-Poly analysis


        -   id: waden_news_response
            categories: ["nazur_orb"]
            sender_email: waden
            recipient_emails: ["emilos.loakim", "loyd.georges"]
            subject: "Reporting in"
            body: |

                Hello, old-timers,

                sorry for the delay, but I've been flat out lately.

                The "thing" exceeds all my hopes in the way it reacts negatively to every one of my attempts at analysis.

                It's still too early to draw conclusions; I'd need some specific kit to investigate its magnetic properties.

                Could you get me a Lasulis transponder and some Barzow lenses as soon as possible, again care of the central concierge desk in Faeran? I'll pick them up next Saturday, very discreetly.

                thanks,
                cya

                *Waden*



        -   "id": jungle_harmony_album_announce
            "body": |
                The Sabarim Gazette is delighted to present to you, as an exclusive, the latest creation of the rising
                star of the music scene, Claudia Pason.

                A native of Alifir, Claudia has been roaming Keroskia for several years in search of hybrid sounds.
                After her stay in the salt desert near Meelish, she is now venturing further north
                for her next album, Jungle Harmonies. An album which, once again, blends traditional
                instruments with field recordings made in the wild. The recording places of its first track,
                in the Kamilia jungle, are listed in our encyclopedia article on Jungle Harmonies.

                .. embed_audio:: [GAME_FILE_URL "audio/musics/Journey in keroskian jungle.mp3"]
            "categories":
            - >-
                universe
            "gamemaster_hints": ""
            "recipient_emails":
            - >-
                [auction-list]@anthropia.pg
            "sender_email": >-
                contact@sabarim-gazette.pg
            "subject": >-
                Jungle Harmonies - Preview


        # QUEST FOR THE GAMMA ORB (see the GM manual) #

        -   id: gamma_villager_tale
            gamemaster_hints: "Gamma Orb: report of the mercenaries sent to the last village before the Kamilia jungle (last-resort clue, against payment of the villager)."
            categories: ["wigwir_orb"]
            sender_email: atyourservice@oberons.pg
            subject: "Report - village on the edge"
            body: |

                Dear client,

                in the last village before the jungle, the elders still remember that story of warriors on the run, pursued by other warriors. None of them ever came out of the jungle.

                For a few kashes, an old fisherman told us about the pygmies of the forest: at every full moon, they set off by canoe to worship their iguana god, a day's paddling upstream, up to the foot of the "black mountain". They sing there all night long, by torchlight, and it is said that the waterfall answers them.

                Our men flatly refuse to go any further into this "jungle of the singing naiads". However, we can put you in touch with a hirer of flying drones, able to comb the area of your choice.

                rgds,

                The Oberons


        -   id: gamma_taranite_camp_notes
            gamemaster_hints: "Gamma Orb: to send (from the relevant contact: superiors, Judicators, Paladium...) to whoever reaches the last Taranite camp, at the foot of Baboon Rock."
            categories: ["wigwir_orb"]
            subject: "The Taranite camp"
            body: |

                Our men have reached the abandoned Taranite camp: a few bones, rusty weapons, and a leather satchel holding the last notes of the Taranite chief, translated below:

                    *"Praise be to the Yods, the orb of the heretics is in our hands. But my warriors are too wounded to turn back through this cursed jungle. Send a rescue team as soon as possible, before fevers or savages finish us off."*

                No trace of the orb on site, nor any grave for these warriors. A pigeon cage lies empty next to the message, which therefore never left.


        -   id: gamma_drone_report_waterfall
            gamemaster_hints: "Gamma Orb: report of the drone sent over the Cascading River (the right area). It mentions the night-time celebrations that the commandos must be warned about."
            categories: ["wigwir_orb"]
            sender_email: atyourservice@oberons.pg
            subject: "Drone report - Cascading River"
            body: |

                Dear client,

                the drone flew over the requested area. Near the source of the river, it picked up a strange crystalline whistling, coming from a cave hidden behind a waterfall (see the picture below). At nightfall, many torches and rhythmic chants were spotted around the cave.

                .. image:: [GAME_THUMBNAIL_URL "images/locations/pygmea_forest_hud.png" "big_width"]
                    :align: center

                rgds,

                The Oberons


        -   id: gamma_drone_report_echo
            gamemaster_hints: "Gamma Orb: report of the drone sent over the Valley of the Breath (the song there is only an echo, coming from the neighbouring Cascading River)."
            categories: ["wigwir_orb"]
            sender_email: atyourservice@oberons.pg
            subject: "Drone report - Valley of the Breath"
            body: |

                Dear client,

                the drone combed the whole valley without spotting anything unusual on camera. The microphones did pick up, at times, a faint crystalline whistling, but it seemed to be carried by the wind, from the south of the valley.

                rgds,

                The Oberons


        -   id: gamma_drone_report_nothing
            gamemaster_hints: "Gamma Orb: report of the drone sent over any other area of the jungle."
            categories: ["wigwir_orb"]
            sender_email: atyourservice@oberons.pg
            subject: "Drone report"
            body: |

                Dear client,

                the drone combed the requested area: jungle, birds, a few monkeys, but no visual or sound anomaly.

                rgds,

                The Oberons


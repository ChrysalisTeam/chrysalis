        -   "id": waden_report_orb_analysis
            "body": |
                hello,

                here, as requested yesterday, is a little recap of my current analysis of the "thing"; I can't wait
                to get back to the academy to study this little treasure in calmer surroundings, and with more
                sophisticated equipment.

                Happy reading,

                *waden*

                -----

                With a refractive index of 1 (which therefore makes it transparent to many optical/wave phenomena),
                zero magnetism, perfect conductivity, prodigious phosphorescence, an extremely solid crystallographic
                structure that nonetheless thwarts every attempt at observation, and an equally mysterious chemical
                composition, this stone clearly defies all classification! This gem most probably
                does not come from our planet.

                What also seems established is that all the "magical" properties that popular tradition
                attributes to giant crystals are disproved by this gem. It is entirely transparent
                to electromagnetic waves and does not even have the interference or focusing properties
                of existing crystals. No risk, then, of setting off chain reactions by stimulating it.

                The most intriguing thing is that high-pitched, crystalline whistling which the gem emits as soon as its temperature
                rises above absolute zero. Under the lasers, the din sometimes becomes quite terrifying;
                lucky this lab is well soundproofed. That must be the "song of the orbs" that
                mythology speaks of.
            "categories": ["doctor_honoris_causa", "nazur_orb"]
            "gamemaster_hints": ""
            "recipient_emails":
            - >-
                loyd.georges@anthropia.pg
            - >-
                emilos.loakim@anthropia.pg
            "sender_email": >-
                waden@anthropia.pg
            "subject": >-
                Roly-Poly analysis


        -   id: waden_news_response
            categories: ["nazur_orb"]
            sender_email: waden
            recipient_emails: ["emilos.loakim", "loyd.georges"]
            subject: "Reporting in"
            body: |

                Hello, old-timers,

                sorry for the delay, but I've been flat out lately.

                The "thing" exceeds all my hopes in the way it reacts negatively to every one of my attempts at analysis.

                It's still too early to draw conclusions; I'd need some specific kit to investigate its magnetic properties.

                Could you get me a Lasulis transponder and some Barzow lenses as soon as possible, again care of the central concierge desk in Faeran? I'll pick them up next Saturday, very discreetly.

                thanks,
                cya

                *Waden*




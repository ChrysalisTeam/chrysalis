        -   "id": "pangea_geopolitics_dorian"
            "body": |
                *Article 2015, and sketches 2014, by C. Loakim*

                [BR]

                **Dorian anthem:**

                .. embed_audio:: [GAME_FILE_URL "audio/musics/The glorious people (Dorian dukedom's hymn).mp3"]

                Historically, Doria was long the favourite whipping boy of the Akarith phalanxes. This is
                why a deep anti-Yodic feeling developed there, until the victory of the "Freedmen's Front",
                a regional coalition, over the last imperialist attempt of the Akariths.

                But for twenty years now, the self-proclaimed Duke of Doria, Stelenas I, has tried to normalise
                his country's relations with neighbouring Akaris, even at the risk of incurring the wrath of
                part of the population, who see it as a sign of weakness, or even of duplicity.

                [BR]

                **Duke of Doria:**

                .. image:: [GAME_THUMBNAIL_URL "images/sketches/brown_noble.png" "big_width"]
                    :align: center

        -   "id": "pangea_geopolitics_masslavia"
            "body": |
                *Article 2015, and sketches 2014, by C. Loakim*

                **Masslavian anthem:**

                .. embed_audio:: [GAME_FILE_URL "audio/musics/Marching to the future (Masslavia's hymn).mp3"]

                The Countess of Mastden has been the representative of the Parliamentary State of Masslavia for
                nearly 40 years.

                Although her legislative and executive power is very limited, she retains considerable influence
                as head of the armed forces and of the intelligence services.

                She favours a hard diplomatic line towards the Akarith Judicators and their calls
                for holy conquest.

                [BR]

                **Countess of Mastden:**

                .. image:: [GAME_THUMBNAIL_URL "images/sketches/senior_lady.png" "big_width"]
                    :align: center

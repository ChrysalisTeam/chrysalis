        -   "id": "pangea_geopolitics_thelassar"
            "body": |
                *Sketches 2013, article 2015, C. Loakim*

                The land of Thelassar runs on a very complex system of representative democracy, which means
                that very few political scientists are able to predict which senator will be the next to be
                elected to replace one of the two incumbent "consuls".

                With these forced cohabitations, the country's domestic politics and diplomacy tend to
                stagnate, but the population seems perfectly happy with it.

                [BR]

                *The two current consuls, Izrina Bouchkef and Helethor Podvin.*

                .. image:: [GAME_THUMBNAIL_URL "images/sketches/glass_lady.png" "big_width"]
                    :align: center
                .. image:: [GAME_THUMBNAIL_URL "images/sketches/light_blue_general.png" "big_width"]
                    :align: center
            "categories":

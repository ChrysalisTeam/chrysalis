        -   "id": "pangea_geopolitics_akaris"
            "body": |
                *Article 2015, and sketches 2015, by C. Loakim*

                [BR]

                *Akarith anthem:*

                .. embed_audio:: [GAME_FILE_URL "audio/musics/The long wait for dawn (Akaris' hymn).mp3"]

                [BR]

                The religious Order of the Akarith Judicators. Is there really any need to talk about it, so
                full of it are the news?

                *A monk of the Order of the Akarith Judicators, in ceremonial dress.*

                .. image:: [GAME_THUMBNAIL_URL "images/sketches/masked_monk.png" "medium_width"]
                    :align: center

                [BR]

                One can still note a few peculiarities little known to the general public; for instance the fact
                that, although it defines itself as monastic, this order has created a special status of "semi-nun",
                so that the high Judicators can build themselves their little harem at will; or that its
                symbol (the crossentar), as well as its Holy Book, are considered by experts to be mere
                deviations/assemblages put together from the religions that predate the Tectonic Era;
                or finally that, despite the apparent national unity displayed to the outside world, this order
                is far from unanimously accepted among the various Akarith tribes, who consider it either too
                harsh towards the "bathars" ("those who are not of the pure race of the sons of the Yods"), or
                not harsh enough.

                *Semi-nun, courtesan of the Judicators.*

                .. image:: [GAME_THUMBNAIL_URL "images/sketches/midolian_courtesan.png" "medium_width"]
                    :align: center

                [BR]

                Finally, one of the problematic points of this order is that it has a pronounced taste for
                megalomaniac projects, but cruelly lacks the scientific backing to carry them out. Thus, the
                construction site of the Sanctuary of the Yods, in Zorzas, ran up against technical limitations
                that no construction company was able to get round, despite the mountains of gold released
                by the Judicators. To this day, the project is "suspended indefinitely, upon the decision-making
                inspiration of the Yods".

                **Concept of the Sanctuary of the Yods.**

                .. image:: [GAME_THUMBNAIL_URL "images/sketches/futuristic_tower.png" "medium_width"]
                    :align: center

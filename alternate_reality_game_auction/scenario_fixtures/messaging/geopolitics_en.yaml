
messaging:

    manual_messages_templates:


        -   id: "pangea_geopolitics_accounce"
            gamemaster_hints: "Announcement of the series of artworks revealing the important figures of Pangea."
            categories: ["universe"]
            sender_email: contact@sabarim-gazette.pg
            recipient_emails: "[auction-list]@anthropia.pg"
            subject: "Geopolitical Sketches - Announcement"
            body: |

                Dear Readers,

                many Pangean cultures consider that taking someone's photograph is an assault on the integrity of their soul. International journalists have therefore often had, willy-nilly, to take up sketching in order to illustrate their reports.

                This month, the Sabarim Gazette therefore offers you a retrospective, in drawings and music, of Pangean geopolitics. And this by following the travels of our reporter Cynthia Loakim throughout her first 4 years in the profession, as well as her valiant progress in the art of capturing high-ranking figures in a few pencil strokes.

                *See you very soon for the first article in our series: Lordania.*



        -   "id": "pangea_geopolitics_lordania"
            "body": |
                *Article 2015, and sketches 2012, by C. Loakim*

                [BR]

                **Lordanian anthem:**

                .. embed_audio:: [GAME_FILE_URL "audio/musics/The proud island (Lordania's hymn).mp3"]

                The Lordanian Federation came into being naturally, through the aggregation of small scattered
                kingdoms and republics, first bound together by an ever more intense "gentle commerce", then
                united to build solid trade relations with a great number of Pangean states.
                Through the efforts of Lord Annye, a young and formidable diplomat, it acquired 5 years ago
                the embryo of a federal state, mainly intended to protect the interests of the federation
                against emerging economic and political rivals.

                While the federal army remains purely defensive, it is on the other hand no secret to anyone
                that the "intelligence services", led by the discreet General Larrange, are at work all over
                Pangea to make sure that no rival or serious danger ever comes to trouble the federation,
                in the short or the long term.

                [BR]

                **General Larrange:**

                .. image:: [GAME_THUMBNAIL_URL "images/sketches/dark_blue_general.png" "big_width"]
                    :align: center

                [BR]

                **Lord Annye:**

                .. image:: [GAME_THUMBNAIL_URL "images/sketches/red_general.png" "medium_width"]
                    :align: center

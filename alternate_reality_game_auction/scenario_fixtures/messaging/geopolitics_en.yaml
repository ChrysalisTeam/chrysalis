        -   "id": "pangea_geopolitics_heliossar"
            "body": |
                *Article 2015, and sketches 2014, by C. Loakim*

                [BR]

                **Heliossarian anthem:**

                .. embed_audio:: [GAME_FILE_URL "audio/musics/Sweet smell of liberty (Heliossar's hymn).mp3"]

                In Heliossar, Marshal De Dianous is the de facto regent of the country, because parliament is
                struggling to find a sufficient majority to elect a Grand Mandatary, and scandals of sex and
                corruption bring down the members of parliament one after the other.

                As a result, the country is barely present on the international stage, and its public opinion
                does not seem very aware of the growing tensions with Akaris, especially as the Marshal
                keeps calling for confidence and denouncing "mountains made out of molehills" whenever
                some intellectual or other calls for patriotic mobilisation.

                [BR]

                **Marshal De Dianous:**

                .. image:: [GAME_THUMBNAIL_URL "images/sketches/brown_general.png" "big_width"]
                    :align: center

            "body": |
                Dear colleagues and friends of the Alifir Academy,

                A small drinks reception will be held in 20 days in honour of the engagement of our young and talented
                quantum physicist, Waden Shaw, to the no less talented reporter Cynthia Loakim (whose
                name should, quite rightly, ring a bell).

                Following the excesses of the last such occasion, only sweet cider will be allowed,
                and breathalyser tests will be carried out on the way in and on the way out.

                *The Deans*


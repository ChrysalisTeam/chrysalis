        content: |

            .. note::

              This article has been flagged as disputed by contributors to the encyclopedia:

              - lack of perspective on the events described
              - lack of references
              - lack of neutrality in tone


            Sir Loyd Georges is an extraordinary figure of the city of Salima, in the land of Sabarim.

            Descended from a noble and wealthy lineage, he very early on forsook the calm and delights of his splendid manor, as well as studies whose theory stifled practice, to roam the world and bring to light the remains of vanished civilisations.

            **Motto: "Nobility, science, arts and fantasy"**

            .. image:: [GAME_THUMBNAIL_URL "images/portraits/loyd_georges_portrait.png" "big_width"]
                :align: center

            His latest feat of arms: a lightning expedition into the depths of Midolia, to snatch the contents of an ancient Yodic temple from fanatical clutches. He of course thanks his faithful right-hand man, Rydji, for his invaluable help in carrying out this courageous mission.

            .. image:: [GAME_THUMBNAIL_URL "images/portraits/rydji_portrait.png" "big_width"]
                :align: center



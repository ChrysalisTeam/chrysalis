            Professional life
                Professor Loakim is head of the department of Tectonic archaeology at Alifir Academy. He is currently conducting research on the Yodic civilisations of Midolia.

            Family life
                Professor Loakim married in 1985 in the village of Dibel, just south of the city of Cazoar. He and his wife Loucia then settled in Alifir, where their daughter Cynthia was born. The professor has been a widower since 2010.

            .. image:: [GAME_THUMBNAIL_URL "images/portraits/emilos_loakim_portrait.png" "big_width"]

            .. image:: [GAME_THUMBNAIL_URL "images/portraits/judicator_portrait.png" "big_width"]
                :align: center

        gamemaster_hints: |

            SUMMARY - for the caste of the Judicators, who made their own blend of the previous doctrines:

            - polymony is a fundamental dogma (one says "the Yods" and not "Yod")
            - eschatology is necessarily in-vivo (the three orbs must be found as soon as possible for the era of bliss to come about)
            - transfiliation is an interesting hypothesis, to be spread among the reluctant population, in order to be able to scrape together new faithful and allies among the neighbouring peoples.


    yodic_quotes:
        title: "Yodic Quotes"
        categories: ["encyclopedia"]
        keywords: ["yodic quotes", "theology", "yods?", "akaris", "transfiliation"]
        content: |

            **A few famous quotations, from various Yodic denominations and figures.**

            1. What perfume is more pleasing to the nostrils of the Yods than that of a filial spirit, broken and crushed? *Hayo Li*

            2. O Yod be my witness, this era will hardly end before Akaris the Glorious imposes respect for thy Holy Name on all the irredeemable bathar nations. *Prophet Ysotop*

            3. The diletion of the Yods sets ablaze every faithful who devotes his life to the recovery of the sacred orbs. *Master Subal' Tern*

            4. O thou who seekest the Yods, make no mistake: obedience, mortification and contemplation are the only three jewels that will win thee their graces. *Hermit Seulomond*

            5. Nothing is impossible to the Yods, except going against their own will. *Yodic Holy Book*

            6. Jubilation is to transcendence what immanence is to piety, that is to say the anamnesis of an entelechy through the intercession of Yodic grace. *Diakon Hermes Tick*

            [BR]

            **An Akarith archbishop:**

            .. image:: [GAME_THUMBNAIL_URL "images/portraits/archbishop_portrait.png" "big_width"]
                :align: center

        gamemaster_hints: |

            **Opinion of the Akarith Judicators on these quotations:**

            1. Off topic, as it concerns the faithful already won over to the Yods
            2. Heretical, as it speaks of "Yod" as a personal first name, and denies any possible transfiliation
            3. Orthodox, as it calls for the quest for the orbs
            4. Heretical, as it denies the importance of the quest for the orbs
            5. Orthodox, as it opens up the possibility of transfiliation
            6. Off topic, and incomprehensible


    salt_deserts:
        title: "Salt Deserts"
        categories: ["encyclopedia"]
        keywords: ["salt deserts?", "desert", "pack ice", "sea", "salt"]
        content: |

            A salt desert, or "salar", is a vast deposit of sediments made up
            mainly of salts (chlorides, sulphates, nitrates, borates, etc.).
            It typically forms through the evaporation of a salt lake whose water inflow is insufficient.

            Pangea has many salt deserts, among the largest of which are:

            - the "perched saline sea" east of Meelish
            - the "salt pack ice" near Endara
            - the "pearly lakes" in the centre of Balberith
            - the "salted rivers" north of Mastden

            [BR]


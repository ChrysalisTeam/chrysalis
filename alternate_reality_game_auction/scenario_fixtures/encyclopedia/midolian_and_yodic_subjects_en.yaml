    midolian_wars:
        title: "Midolian Wars"
        categories: ["encyclopedia"]
        keywords: ["midolian wars?", "akariths?"]  # remember that the FIRST keyword will get auto-linked in misc. content
        content: |

            *"The history of the Midolian continent boils down to a succession of expansions and downfalls of the Akarith empire, at the whim of the conquering flights of the various religious orders that succeeded one another at its head, and of their spontaneous disintegration owing to irreconcilable doctrinal divergences between high dignitaries; the neighbouring peoples have suffered grievously from each of these fanatical resurgences, and their demographics still bear today the scars of the countless incivilities to which they fell prey."*

            *Lucius Dimnus, "A History of Pangea for the Distinguished"*

            ------------

            What good old Lucius sums up so eloquently is that for millennia, the very same scenario has been playing out in Midolia.

            #. the tribes of Akaris grow economically and militarily
            #. they start dreaming of a thousand-year Akarith empire, spurred on by some fanatical guru
            #. they set off on a crusade against the neighbouring peoples (corresponding to today's Dorians, Masslavians, Heliossarians or even Thelassarians)
            #. they impose their tyranny on the conquered territories, for a few years
            #. enlarging the empire becomes harder and harder, hence theological quarrels between high-ranking Akariths
            #. the empire collapses, and the continent sinks into anarchy and misery for a few generations
            #. go back to step 1.

            A sorry spectacle indeed. However, during the last Midolian war, a century ago, the Akarith soldiers (called **zealots**) were immediately held in check by particularly determined Masslavian and Heliossarian guerrillas. The counter-attack of this "Freedmen's Front" left Akaris bled dry and more divided than ever, and granted its neighbours a lasting peace.

            But recently, the religious order known as the "Judicators" has risen to power in Akaris, by restoring the land's oldest traditions to a place of honour. Worshipped as "Messengers of the Yods" (the local deities), and enjoying a glittering economic climate, the Supreme Judicator Arthanas and his court do not seem inclined to stop while the going is good.

            In Midolia, is the future nothing but a long past? Only the future will tell.

            [BR]

            *The symbol of the Akarith Judicators, the crossentar:*

            .. image:: [GAME_THUMBNAIL_URL "images/emblems/crossentar_symbol.png" "big_width"]
                :align: center


    sacred_orbs:
        title: "Sacred Orbs"
        categories: ["encyclopedia"]
        keywords: ["divine orbs?", "tears?", "orbs?", "divine"]
        content:   |

            .. note::

                This is no mistake: an orb is indeed an "it", even though intuition, as with ships, might plead for a "she".

            One of the oldest Midolian myths known to date.

            It tells how the Yods (Akarith deities) one day gave the priest Melkisedech, ancestor of all Akariths, three sacred orbs guaranteeing the dominion of his race over the whole planet.

            After a few millennia of this "Age of Universal Balance", the orbs fell through treachery into impious hands. Harmony was then broken, and the Akariths had to take refuge at the far edges of the Midolian continent, while the degenerate tribes took possession of the whole of Pangea. The outraged Yods then unleashed upon the planet epidemics, tornadoes, ingrown toenails, earthquakes and other horrors; all of this as a nagging reminder that their precious gift had been flouted, and that the Akariths would never know peace until this sacrilege was redeemed.

            The existence of these famous orbs (also called sacred stones, Divine Tears, holy gems and many other combinations) remains a matter of controversy. However, should they one day be found, there are two things that the neighbours of the Akarith peoples would dread enormously.

            The first would be to possess these orbs; for this impiety, if it became known, would earn them an immediate attack by the Akarith fanatics. The second would be not to possess them; for if the orbs then ended up in the hands of the Akarith religious leaders, it would justify an even deadlier imperialist push. A Masslavian lieutenant of yesteryear summed up this analysis of the situation thus in his memoirs: "if ever these rocks should come back to light, whatever we do, we'll be deep in the shite".

            [BR]

            *The oldest known depiction to date of the myth of the Akarith orbs, a drawing on cloth:*

            .. image:: [GAME_THUMBNAIL_URL "images/locations/cloth_drawing_temple.png" "big_width"]

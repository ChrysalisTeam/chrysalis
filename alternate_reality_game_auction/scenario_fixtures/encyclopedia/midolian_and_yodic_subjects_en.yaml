    wigwir_battle:
        title: "Battle of Wigwir"
        categories: ["encyclopedia"]
        keywords: ["battle of wigwir", "battle", "wigwir", "keroskia"]
        content: |

            The "Battle of Wigwir" is a mythico-historical event, during which the rival Yodic denominations of the Taranites and the Razulites are said to have clashed for the last time, and one of the Divine Orbs to have been lost.

            No trace of the site of this battle has been found anywhere in Midolia, and it is now commonly accepted that this battle is legendary. In reality, the Taranites are thought to have imposed their doctrine on Akaris far more gradually.


    mount_shina:
        title: "Mount Shina"
        categories: ["encyclopedia"]
        keywords: ["mountain", "mount", "shina", "sanctuary"]
        content: |

            It is the highest peak of the Midolian mountain range, characterised by its eternal snows and its most inhospitable fauna: snow snakes, touchy caracals, poisonous edelweiss.

            During the "Yodic tides", it was regarded as an important sanctuary by certain denominations.

            Since the implosion of the last Akarith empire, this mountain has stood in the centre of **Masslavia**, and (theoretically) no longer has any religious significance, unlike many other heights: Mount Olysho (Heliossar), Brumerre Hill (Doria)...

            .. image:: [GAME_THUMBNAIL_URL "images/locations/sky_dome.jpg" "big_width"]
                :align: center


    ancient_deities:
        title: "Ancient Deities"
        categories: ["encyclopedia"]
        keywords: ["gods?", "goddess(es)?", "deit(y|ies)", "egypt", "theology", "dogs?", "cats?"]
        content: |

            The Yodic religions, and their offshoots, are nowadays overwhelmingly predominant on Pangea.

            But in the past, long before Tungunska, very different sets of gods shared the planet. The pantheons of the so-called "Greek", "Roman", "Egyptian" and "Oriental" cultures are thus currently being catalogued by the glorious Alifir Academy.

            Curiously, many civilisations drew their deities from anthropomorphised animals.
            Thus Ancient Egypt had, among others, gods and goddesses:

            - with the head of a Ram:

              - Ageb
              - Banebdjedet
              - Khnum

            - with the head of a Canid:

              - Anubis
              - Bedou
              - Wepwawet
              - Set

            - with the head of a Feline:

              - Apedemak
              - Bastet
              - Sekhmet

            - with the head of a Falcon:

              - Hemen
              - Montu
              - Nephthys
              - Sokar





...


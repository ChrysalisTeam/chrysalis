    akaris_runes:
        title: "Akarith Runes"
        categories: ["encyclopedia"]
        keywords: ["akarith runes?", "runes?", "ancient"]
        content:   |

            Akarith runes are a rudimentary alphabetic writing system, whose nonconformism suggests that it was invented out of thin air to counter the intrusion of languages from Axolia.

            These runes appeared suddenly around the middle of the Tectonic Era, on the North Coasts of Midolia. They were most likely borrowed from the alphabet of an earlier civilisation, which vanished without leaving any other trace.

            The peculiarity of this writing system is that it does not transcribe consonants, but only vowels and accents marking intonation. This results in a certain propensity for homonymy, sentences such as *"we rejoice at the fruitful commercial collaboration now taking shape between our two countries"* and *"we relish the prospect of wiping out your whole degenerate race by fire and sword"* being written identically in this system.

            Historians have noted that one of the deadliest outbreaks of Akarith tribal wars coincided with the replacement of oral messengers by diplomatic scrolls written in runes. It is by consensus agreed that the one explains the other.

            [BR]


        title: "Brotherhood of the Oberons"
        categories: ["encyclopedia"]
        keywords: ["brotherhood of the oberons", "oberons?", "puks?", "brotherhood", "mercenar(y|ies)"]
        content: |

            .. image:: [GAME_THUMBNAIL_URL "images/locations/foggy_crater_city.png" "big_width"]
                :align: center

            The Brotherhood of the Oberons is an international collective which officially presents itself as a fraternity of "jacks-of-all-trades", offering their many skills to whoever wants them (and can afford them).

            In practice, the fees of these "Oberons" (the origin of the word has been lost) are rather exorbitant, and they seem to be hired mostly for shadowing, espionage, computer hacking or burglary jobs. They nevertheless deny doing anything illegal, and ostracise as black sheep those of their brothers who have been caught red-handed.

            This nebulous network is made up of autonomous "hubs", present in the main cities of Pangea. All of them obey a few rules, as unspoken as they are strict:

            - no violence: the brothers are above such dishonourable vulgarities (but they may delegate them to hoodlums of their acquaintance, known as "puks")
            - no conflicts of interest: if clients give contradictory instructions, or try to harm one another, the Oberons step aside, and let their clients settle their disputes among themselves
            - no suicide missions: no Oberon is bound to do the impossible



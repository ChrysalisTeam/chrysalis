"summary_generation":
  "game_facts_template": "summaries/game_facts_summary_{lang}.txt"
  "game_facts_destination": "gamemaster/game_facts_summary"

  "game_symbols_template": "summaries/game_symbols_summary_{lang}.txt"
  "game_symbols_destination": "gamemaster/game_symbols_summary"

  "game_items_template": "summaries/game_items_summary_{lang}.txt"
  "game_items_destination": "gamemaster/game_items_summary"

      - [recipe_pyrolitis_tincture, 1, {fr: "Teinture Pyrolitis -", en: "Pyrolitis Tincture -"}]
      - [recipe_rejuvenation_cocktail, 1, {fr: "Cocktail de Réjuvénation", en: "Rejuvenation Cocktail Sovereign"}]
      - [extra_alchemy_recipes, 1, {fr: "Notes d’Alchimie Atomique", en: "Notes on Atomic Alchemy"}]
      - [thanatologue_extract, 4, {fr: "... alors que la défaite", en: "... as defeat seemed"}]
      - [meredice_diary_extract, 1, {fr: "Cher journal, cette", en: "Dear diary, this fifth"}]
      - [chromacryptographic_messages, 2, null]
      - [parcival_oracle_vision_about_water_mill, 1, null]
      - [parcival_oracle_vision_about_necromancers_and_ring_amplificans, 1, null]
      - [parcival_oracle_vision_about_maupertuis_father_twin_books, 1, null]
      - [parcival_oracle_shared_vision_about_world_threat, 3, null]
      - [parcival_oracle_vision_about_chaos_novel_tome_3, 1, {fr: "CHAOS T3 ZOOLOGIE", en: "CHAOS V3 ZOOLOGY GASTRONOMY"}]
      - [secret_codes_converters, 1, {fr: "Codes Secrets Connus", en: "Known Secret Codes"}]
      - [unreadable_runes, 2, null]

      - [archivist_diary_in_his_case, 4, {fr: "8 octobaire 500 Ô que", en: "8 octobaire 500 O,"}]
      - [book_shelf_labels_for_library1, 1, {fr: "RAYON ZOOLOGIE RAYON", en: "ZOOLOGY SHELF GASTRONOMY"}]
      - [skeleton_danger_symbol, 1, null]
      - [book_shelf_labels_for_library2, 1, {fr: "GRIMOIRES TEINTURES GRIMOIRES", en: "TINCTURE GRIMOIRES PHILTRE"}]
      - [maupertuis_caduceus_symbol, 1, null]

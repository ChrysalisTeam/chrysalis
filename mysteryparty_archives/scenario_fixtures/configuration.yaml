      - [maupertuis_father_chest_code_anamorphosis_enigma, 1, null]
      - [maupertuis_whispering_box_enigma, 1, {fr: "(Énigme de la Boîte", en: "(Whispering Box Riddle)"}]
      - [octave_diary_on_his_tomb, 1, {fr: "Cher journal intime,", en: "Dear diary, For ages"}]
      - [letters_to_maupertuis_parents, 2, {fr: "Le 23 Septemaire 500", en: "23 Septemaire 500"}]
      - [octave_instructions_for_initiation, 1, {fr: "Octave, voici les", en: "Octave, here are the"}]
      - [avatar_novel_summaries, 2, {fr: "Roman « Les cygnes", en: "Novel “The Pond Swans”"}]

abilities:

    runic_translation:
        settings:

            result_delay: null

            references:

                amphora:
                    translation: >
                        sacred salt | certified compliant #
                        for expiatory rites | before kamikaze operations #
                        not to be used for meals

                sacred_book:
                    translation: >
                        dilute the fresh fungal juice | in hot water #
                        sprinkle the crushed | mollusc limb #
                        stir at length | possibly adding | the extras #
                        add the reddish | fruit liqueur #
                        serve cold

                horned_statue:
                    translation: >
                        O Bartzar | glorious champion of the Yods #
                        when the orb has returned | you shall launch our troops  #
                        to reconquer the world | according to the plan #
                        set out in the | panorbium fortuna

                antic_chest:  # SUPPOSEDLY UNUSED IN MURDER PARTY
                    translation: >
                        spoils of war | skirmish of | the black meadows #
                        may the yods | purify these goods #
                        shortent our penance | and give us final victory


            middlewares:
                translation_form:
                    CostlyActionMiddleware:
                        money_price: 300
                        gems_price: 100


    matter_analysis:
        settings:

            result_delay: null

            reports:
                amphora: |
                    Common amphora of the pre-Tunguska civilisations, made of rich mortar.

                    Presence of Akarith runes in blue stone powder.

                    Presence of fruit-tree pollens from Akaris around the rim.

                    Deposit at the bottom of the amphora, consisting of:

                    - coarse sea salt
                    - aromatic herbs from the hills of Akaris
                    - extracts of leafy toad sweat
                    - plum stone powder
                    - wild berry powder

                    Mixture with strong stimulant, psycho-psychedelic, and analgesic properties.

                basket_bottle: |
                    Demijohn hand-blown from a mixture of crushed glass and crystal.

                    Dimensions of a rare size for this type of work.

                    Woven wicker basket casing typical of Midolia.

                    Common cork stopper.

                    Deposit of 68% alcohol liqueur, made from "scarlet sun" red plums specific to Akaris.

                    Traces of powdery compounds from the horn of a caprine animal, unfortunately not recognised by our databases.

                rusty_chest: |

                    Chest made from a rather peculiar mixture of Akarith wood species: birch-willow, weeping pine, and grey beech.

                    The ironwork, made of low-quality iron, is heavily rusted.

                    No visible inscription.

                    Slight deposit of sweet potato peelings at the bottom of the chest.

                sacred_book: |
                    Grimoire with a beechwood cover.

                    Leaves of leather parchment, from black goats of Akaris.

                    Ink made of "Royal Najah" snake blood.

                    Script used: Akarith runes

                    Heavily used book, kept in a very humid atmosphere.

                    A few candle wax stains along the edges of the pages.

                    Inscription scrawled on the last page, in ancient Akarith, meaning: "beware of the extras, double-edged recipes"

                horned_statue: |

                    Statue in grey and green marble from Akaris, inlaid with semi-precious stones and adorned with Akarith runes.

                    Probably a unique piece.

                    Contains at its centre a reliquary holding a whole human body, mummified and curled up on itself.

                    Body of a man in his forties, with no traces of visible injury.

                    General depigmentation of the skin, indicating an end of life without sunlight.

                    Swelling of the dermal tissues suggesting death by drowning.

                    Numerous lesions in the cervical cortex, due to the presence of "Royal Najah" snake venom.

                small_leather_bag: |

                    Very common cowhide purse.

                    Contains residues of an aqueous mixture, whose unusual chemical interactions unfortunately prevent a fine analysis at the molecular level.

                    Proportions of the components of this mixture:

                    - 25% fungal flesh
                    - 30% plant flesh
                    - 30% animal flesh
                    - 15% unidentified matter

                pocket_clock: |

                    New pocket watch, of industrial make typical of Lordania.
                    Low-quality oscillating mechanism.

                    The outside of the watch bears traces of marine iodine, mixed with vapour deposits of "lime-blossom liqueur", a drink imported from Lordania and only served in about 80 Sabarith taverns (mostly of the "AuBonPichet" franchise).
                    Common cellar dust is present on top of all these deposits.

                    Cotton sachet of brown powder hidden at its centre. It contains very pure "Zombifying Drug", with a few traces of Akarith pollens.



            middlewares:
                process_artefact:
                    CostlyActionMiddleware:
                        money_price: 400
                        gems_price: 130



    world_scan:

        settings:

            result_delay: null

            scanning_sets: {}

            item_locations:
                amphora:  # leads to akarith sect inside Salima, and anonymous post office box near manor
                    scanning_set: null
                    message: |
                        9,656 echoes, spread across the whole of Pangea, were returned for the clones of this artefact.

                        Most of the echoes are very weak, and concern only 1 or 2 specimens stored
                        in the same place.

                        Two fairly strong location clusters have however emerged in the land of Sabarim:

                        - coordinates XJ16 in Alifir, around the Café Bargarac
                        - coordinates LK89 in Salima, around the Purineur Brasserie
                        - coordinates OL76 in the Hamlet of Wiskons near Salima, around the village square

                basket_bottle:  # narrows the search for the ORB
                    scanning_set: null
                    message: |

                        56 echoes, spread across the whole of Pangea, were returned for the clones of this artefact.

                        Here are the echoes precise enough to be usable (radius: ~100 m), all located in Sabarim.

                        Salima/Belez region:
                            Districts 23, 56, 88, 99 and 187

                        Alifir region:
                            Districts 22, 76, 112 and 278

                        Faeran region:
                            Districts 11, 67 and 101

                        Cazoar region:
                            Districts 56 and 122

                rusty_chest:  # narrows the search for the ORB
                    scanning_set: null
                    message: |

                        87 echoes, spread across the whole of Pangea, were returned for the clones of this artefact.

                        Here are the echoes precise enough to be usable (radius: ~100 m), all located in Sabarim.

                        Salima/Belez region:
                            Districts 20, 56, 90, and 120

                        Alifir region:
                            Districts 22, 112 and 300

                        Faeran region:
                            Districts 2, 70 and 101

                        Cazoar region:
                            District 33

                sacred_book:
                    scanning_set: null
                    message: |

                        A single echo, 550 m in diameter, occurred for this artefact, and it is located in the land of Slavinka,
                        on the huge archaeological dig site organised by Professor Loakim.

                horned_statue:
                    scanning_set: null
                    message: |

                        No echo was returned for this artefact, apart from vague resonances in the History/Geography
                        museums of Sabarim.

                small_leather_bag:
                   scanning_set: null
                   message: |

                       Several million echoes across Pangea were returned for this small leather bag,
                       making them impossible to exploit.

                pocket_clock:  # narrows the search for INFILTRATED AKARITHS IN SABARIM
                    scanning_set: null
                    message: |

                        Several thousand very weak echoes came back from all over Pangea for this artefact, especially in Lordania.
                        These must be private individuals who own a specimen.

                        Observed correlation: a large number of these districts contain one or more "AuBonPichet" taverns; some sixty of them in all are thus covered.

                        Salima/Belez region:
                          Districts 13, 67, 100, 125, 169

                        Alifir region:
                          Districts 33, 133, 241

                        Faeran region:
                          Districts 77, 79, 88

                        Cazoar region:
                          Districts 99, 233

            middlewares:
                scan_form:
                    CostlyActionMiddleware:
                        money_price: 450
                        gems_price: 160


    house_reports:
        settings:
            result_delay: null
            middlewares:
                get_surveillance_report:
                    CostlyActionMiddleware:
                        money_price: 100
                        gems_price: 30



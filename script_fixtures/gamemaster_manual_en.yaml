        Appendix - Game Checklists
        =============================

        *If only one part of the manual deserves to be printed and kept close at hand, it is probably this one.*

        Initial checklist
        ++++++++++++++++++++

        - read the whole Game Master manual, to have a good "overall vision" of the game
        - go through all the sections of the Anthropia portal (including those reserved for "characters", thanks to the specially dedicated NPC); read the help (the "?" buttons) of each page, especially the haloed boxes reserved for the Game Master
        - configure the characters: turn the surplus characters into NPCs, give the players an "official name" derived from their real name (for ease of use), decide on the initial money of each...
        - check the settings of the special abilities (prices, usage limits...); they cannot be modified directly from the portal, but it is possible to ask the Chrysalis webmaster, if specific needs arise

        Checklist for the auctions
        ++++++++++++++++++++++++++++++++

        - decide on the type of auction wanted for each instance, and whether or not the players should be informed in advance
        - in the case of remote auctions, video multiplexing software (e.g. "ManyCam") can make it possible to juggle between screen sharing and the webcam, with nice special effects on top
        - to present the auction items one by one, for example with the portal's "slideshow", remember to **log in as Loyd Georges** (e.g. in a different browser from the usual one), so as not to disclose sensitive information on screen
        - during the auctions, above all keep a notepad to write down the **sale price and the highest bidder** of each lot


        Daily checklist
        ++++++++++++++++++++++++++++

        - check the recent "system events"
        - answer the emails addressed to the NPCs (including those automatically sent by the special abilities)
        - monitor the exchanges between players, and step in as "hierarchical superior" if needed (at least as long as the superiors in question have not been blocked by the players concerned)
        - go through the "dashboard" to see whether there are abilities or pages which would deserve to be activated; same thing, more rarely, for the players' "personal permissions"; remember to notify the players of any new opportunity activated on the portal
        - open the "information tap" from time to time: new encyclopedia articles (via their first keyword slipped in here and there), radio spots, articles of the Sabarim Gazette, various exchanges between NPCs (often taken from the email templates)...
        - prompt the players who seem to be wandering aimlessly, e.g. by "calling them in to report" by phone, on behalf of their hierarchical superiors
        - keep an eye on the overall course of the game, and especially on the "fixed" events of the game (distributions of money, auctions...), with the help of the summary timeline below



        .. raw:: pdf

            PageBreak


        Summary timeline of the game
        ++++++++++++++++++++++++++++++++++++++++

        Here is an example of an overall timeline for a game of Chrysalis. Most quests will require the Game Master to simulate incessant exchanges of emails between NPCs, and from NPCs to players (with emails found in the templates available on the portal, or left to the GM's invention).  Same thing for the radio spots, which will have to be renewed regularly, and broadcast many complementary mini-clues in order to guide the players towards the "hot spots" of the game.

        The texts in bold correspond to the major deadlines which set the pace of the game. The texts in italics correspond to "bonuses", optional activities. The identifiers between square brackets refer to the "quest" concerned by the event.

        .. note::

            The "chiefs" here designate the hierarchical superiors of the players, whether those of the secret services (to which the players belong at the beginning of the game), or those of the super-factions which the players will potentially have joined.


        - initial state: send the summary reports of the LG affair, from the chiefs of the secret services to their agents

        - **initial abilities: wiretapping, and hiring of mercenaries**

        - **INVITATION of the players, everyone gets to grips with the Anthropia portal**

        - sending of the death threats (spam), and of the mission letters by the chiefs to the pairs of agents

        - *OPTIONAL: LARP evening opening the auctions, where Loyd Georges gets acquainted with each participant, and unveils the lots which will be put up for sale*

        - [doctorate] radio spot announcing the great upcoming ceremony at the Alifir Academy

        - the chiefs ask the players for a report on their strategy as the first auctions approach

        ------------

        - **FIRST series of auctions (gems only)**

        - LG broadcasts the video introduction narrating his expedition in Midolia

        - the chiefs ask the players to hack LG, so that they stumble over the "secret question" of his Anthropia account.

        - [doctorate] if necessary, push the players to canvass the NPCs *before* acting to influence the course of the Alifir ceremony


        Introduction
        ===============

        **Chrysalis:Auction** is an unusual multiplayer game, at the crossroads of role-playing games, alternate reality games and video games.

        The idea is to take a group of players through a great adventure, over a set period of time (from a few days to several weeks), under the guidance of one (or even several) Game Masters who pull the strings of the story behind the scenes. Chrysalis is therefore not a persistent world game like an *MMORPG*: each Game Master creates their own instance, and the story unfolds there from beginning to end, for the duration of the game.

        Most interactions take place on a dedicated website, where each player has a varying arsenal of tools (encyclopedia, email messaging, chat, radio, special abilities...) to gather information and act.

        In a "long-running" game, each player only needs to spend a little time each day on this portal to advance their quests, and to ponder the strategy to adopt the rest of the time (somewhat like a *casual game*); whereas in shorter and more intense games, players will need to interact with this portal constantly.

        Other means of communication can be used for interactions between players (telephone, text messages...), and it is strongly advised to gather in real life (LARP-style) for some phases, such as the auctions, or the *Mindstorm* closed-door evening meant to serve as the epilogue of the game.


        .. warning::
            To prevent any cheating by your players (you never know...), and any untimely *spoiler*, you are advised not to use the term **Chrysalis**, or any other official reference to the game, until the game is over.

            That is why the fictional website deliberately has a more "neutral" name, Anthropia; you can use this name (or one of your own invention) to refer to the game for as long as necessary.


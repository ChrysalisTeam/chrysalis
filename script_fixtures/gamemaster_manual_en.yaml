        Appendix - Advice to the Game Master
        ======================================

        Your goal, as Game Master, is to fill your players with emotions and gaming pleasures, to make them experience something they do not have in their everyday lives.

        While everything should not fall into the players' laps - to conquer without challenge is to triumph without glory - you must in particular prevent them from getting locked into a feeling of failure, disorientation or uselessness.

        A few dos and don'ts to better succeed in this noble task.



        Rescue the lost sheep
        +++++++++++++++++++++++++++++++++++

        If a player struggles to find their bearings, and a strategy to get into the action, do not hesitate to help them, by means of the countless NPCs and systems of the game. Giving them a few clues, or simply explaining their objectives to them again, will keep them from falling into passivity.


        Reward initiative
        +++++++++++++++++++++++++++++

        It will often happen that, in their groping around, players spend time and (fictional) money on endeavours from which, scenario-wise, nothing is supposed to emerge. It is then up to the Game Master to complete the scenario, so that the player's investigations are not a waste of effort: broadcasting a few clues putting them back on the right track, creating a small side quest allowing them some gains...

        Thus, if a player wiretaps very secondary NPCs, the Game Master would do well, at one time or another, to have them exchange messages with other NPCs (potentially invented for the occasion); messages in which the player will be able to find scraps of information, or new ideas to progress.


        Limit randomness
        +++++++++++++++++++++++++

        It is natural to add a little randomness to a role-playing game, in order to break the possibly "mechanical" side of the gameplay. Thus, the timed actions of Chrysalis (when using various special abilities) are not executed after a fixed delay: the delay is drawn at random within a predetermined time window.

        Be careful, however, not to take the easy way out by drawing lots for every undecided situation (dangerous missions of the mercenaries, competition between the actions of several players...). Even if the player does not realise it immediately, this can put them off afterwards, during the retrospective of the game. It is more tiring, but also much fairer, for the Game Master to weigh each decision according to less volatile criteria:

        - temporal order of the various actions
        - initiative and boldness of the players
        - precision and relevance of the orders they give to their intermediaries
        - relative power of the forces at play
        - "catch-up bonus" for the players who have so far succeeded much less than the others
        - etc. etc.

        But beware, the "temporal order" factor can also be a source of injustice, which brings us to the next point...


        Normalise timings
        +++++++++++++++++++++++++

        If Chrysalis is played in "casual game" mode, over several consecutive weeks, the Game Master must be fair to the players, by taking their time constraints into account when assessing competing actions.

        Thus, if several players send their mercenaries to carry out the same mission, it would be unfair (and thus frustrating and discouraging) for those who have time to play in the morning to be advantaged over those who can only do so in the evening, after their classes or their work.

        Actions taking place within the same time window (typically, 24 hours) must therefore be given similar chances of winning, and it is according to other criteria (precision of the player's directives and information, size of the forces at play, as a last resort a random draw) that successes and failures must be decided. Knowing that it is sometimes possible to share the gains and losses, "pro rata" to the efficiency of the players.

        This constraint is obviously much less important in more continuous game modes (non-stop weekend, holiday week...), in which the adage "first come, first served" will be fully relevant.



        Banish the "Smoke Without Fire" effect
        ++++++++++++++++++++++++++++++++++++++++++++++++++

        More than one Game Master has thought themselves well inspired by taking their players through an adventure full of clues and mysteries, only to finally reveal to them, through a clever plot twist, that in fact there was nothing special to discover - no plot, no monster, no momentous event...

        **To be avoided at all costs.** Twists are welcome, but only if the players see their efforts lead to situations worthy of interest. Everything else is only frustration, and thus demotivation.


        Banish the "Greek Tragedy" effect
        ++++++++++++++++++++++++++++++++++++++++++++++++++

        The great interest of a game, compared to a film, is being able to interact with the story, and to have a real impact on it. So if there is one annoying thing, it is when the efforts and choices of the players are powerless before a relentless destiny (often very sad) awaiting them.

        Some video games have been slated by critics for following this type of scenario. Chrysalis is partly protected from it by the major milestones of its scenario, which by default offer several alternatives depending on the players' actions; but even on smaller scales, that of a side quest for example, it is good that a player's success depends on their perseverance and the soundness of their decisions, not on what the Game Master has decided in advance.



        Personalise the plot
        +++++++++++++++++++++++++++++++

        Chrysalis does much of the Game Master's work by providing, in advance, a large amount of content: images, sounds, encyclopedia articles, but also and above all messaging texts and radio spots.

        In order to add humour and immersion, the Game Master is invited to modify these media before broadcasting them, to incorporate nods, personal details and other *private jokes*.

        Unsurprisingly, this will only work if the game universe (similar to ours except for post-1908 events), as well as the bare minimum of grammatical correctness, are respected.



        Free up ethical choices
        ++++++++++++++++++++++++++++++

        This is probably an area in which Chrysalis stands out from many other role-playing games: dishonesty is not encouraged at the expense of righteousness. Indeed, while theft and aggression are - as often - the fastest ways to get what one wants, in Chrysalis the Game Master is strongly encouraged to develop, in the medium and long term, the negative consequences of this type of action.

        Thus, burglaries and sabotage will give rise to investigations dangerous for the players, and unduly harming "neutral" NPCs will push them to take revenge in one way or another.

        Even the most complex and secret schemes, if they are not legitimised both by their goal and by the means used, may bring serious backlashes from the Paladium - the secret hyperpower of the game which, for once, is not a force devoted to the destruction of humanity.

        Conversely, the players who find ingenious and fair solutions to achieve their ends will potentially win the goodwill of the various NPCs, which will only make their progress easier and easier.

        So that, despite the rather "illegal" context of the scenario (struggles between secret services to recover information and items), the players can achieve their ends without having to trample on ethics, many situations have been deliberately "blackened": the code of WireMind was for the most part stolen from the Alifir Academy, Loyd Georges' competitors for the title of Doctor Honoris Causa have shameful secrets apt to disqualify them...

        These devices, artificial as they may be, allow clever players to oust troublemakers while remaining within their rights; and the Game Master is invited to add some where a "fair solution" would be missing. Since the players in any case only have a very partial knowledge of all these situations, it is a safe bet that they will not be taken aback by the number of injustices-to-be-righted that Chrysalis contains.

        Ultimately, as in real life, the players must be able to choose between the ease of Machiavellianism and the complexity of justice. And as in real life, their good or bad actions should have lasting repercussions, in order to push them to look beyond their immediate gain.




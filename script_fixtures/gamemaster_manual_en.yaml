        Appendix - Introductory Email Templates
        ===========================================

        Below are a few examples of messages to send to the players' real email addresses, to set up the game.
        The tags (words between curly brackets) must of course be replaced by the appropriate contents.


        Welcome and Game Rules
        ++++++++++++++++++++++++++++++++

        ..

            Welcome everyone,

            to this new game of "Chrysalis", the alternate reality game!

            We have here, as players: {{ PLAYERS }}

            And on the "Game Master(s)" side: {{ GAME_MASTERS }}

            You are going to play secret agents, in the service of one of the governments of the planet "Pangea".

            You will soon receive your personal instructions, as well as your access codes to the game portal ( {{ GAME_URL }} ); it is an intranet which will centralise many interactions, between players, but also with fictional characters (the famous NPCs).

            Meanwhile, here are a few pieces of information and various rules!


            ### The universe of Pangea ###

            You will gradually discover the universe of Chrysalis, through the various media, and the various quests, of the game.

            From the Big Bang until the very beginning of the 20th century, this universe was the same as ours. Then something happened, and our universes branched off (it is therefore an *alternate history*).

            The world of Pangea emerged, barely a few centuries ago, from a period of intense meteorological and seismic cataclysms, called the Tectonic Era. It now looks a bit like what our human 20th century was, except that the planet is still very wild overall, and that humans remain concentrated in a constellation of scattered megacities.

            Urban atmospheres range mainly from the Renaissance to the futuristic, with strong steampunk overtones (think "Victorian era, copper machines, classy but outdated suits..."). The most advanced civilisations master combustion engines, the various fossil fuels, solar/wind power, wireless communications... but there are strong disparities in development, and some places still border on prehistory.

            Unsurprisingly, very sharp geopolitical and religious tensions exist between the giant states which divide up the planet (in particular, in a region called Midolia, where the "Yod" deities and their faithful are stirring up quite a mess).

            A few sects and isolated individuals claim to be able to do "magic", but very few scientists would venture to take them seriously; especially since there is already plenty to do with the recently discovered powers of the atom: X-rays, cosmetic creams, collective water heaters with unbeatable efficiency...


            ### IC/OOC distinction ###

            As in any role-playing game, one must distinguish what is in the game ("In-Character") from what is not ("Out-of-Character"):

            - the "pangeaweb" portal is dedicated to the game; the rest of the web is considered as non-existent in Pangea, except for what is shared with our reality (scientific data, History before 1908...)
            - it is possible to communicate by means external to the "pangeaweb" portal (face to face, by phone, by text message, by Skype and its chat...), but PLEASE **use the portal's messaging instead of your "real" emails**, so that the Game Master can follow along
            - any action credible in the context of the world of Pangea is in principle possible (e.g. intrusion into other people's Pangeaweb accounts...); however, if you think you have come across not a feature but a bug, please report it
            - the ".pg" addresses are specific to the messaging of the game portal, there is no point trying to send them a message from your real email client (gmail, thunderbird...); likewise, you cannot send a message to a real email address from the internal messaging of the "pangeaweb" portal
            - during possible "live-action" sequences, real objects are out-of-game by default, unless they are marked with {{ MARKER }}; in particular, the Game Master's equipment store (various sheets, disguises, stock of banknotes...) is off-limits
            - of course, you do not attack the other players *physically*
            - it is normal that many contents initially seem missing or blocked; it is up to you to discover for example new encyclopedia articles, or to gain access to the inactive special abilities of the menu
            - if in doubt about how the portal or the game works, or about what is allowed or not, contact the Game Master(s)


            ### Flexible time ###

            In order to take everyone's constraints into account, the game runs in "flexible time": the actions of the various players are considered simultaneous as long as they take place within a certain time window (typically, 24 hours); thus the one who plays in the morning will not be favoured, in their initiatives, over the one who can only log into the portal in the evening.

            Overall, the game should last {{ TOTAL_GAME_LENGTH }} weeks, with a series of auctions which will take place - unless otherwise instructed - every {{ AUCTION_TIME }}.


            ### Currencies ###

            The main currency of exchange used on Pangea is the *kash*, written '¤' (note that 1¤ is worth about €100 in our reality); this dematerialised currency, poorly regulated and easy to conceal, lends itself to not-so-lawful operations, hence its controversial reputation.

            Each country also has its own national currency; thus, the country of Sabarim closely watches the rate of its precious Sabarith Pound, the only currency officially authorised for major purchases (*note that one Sabarith Pound is, by chance, worth exactly 1¤*).

            The exchange rates of Pangea, and national regulations, make conversion between these currencies costly and complex; but it is always possible to try...

            Every week, your superiors will pay you *wages in kashes*, whose amount may vary according to your performance, and to the relevance of the needs you express. You will also have a capital of Sabarith Pounds at your disposal, to be used primarily for the auctions, and which will be very difficult to increase. Do not hesitate to ask your superiors, if you lack visibility on your income.


            ### Various Tips ###

            Some information is public, such as your logins on the Anthropia portal ("Amethyst", "Garnet"...), or your official identities as bidders. Other information is secret, such as your allegiances, and your true missions.

            Pay attention to the information and instructions coming from your allies and your hierarchical superiors, and coordinate your actions with them, in order to have more weight on events.

            Dare to ask the NPCs for help, and to question them about the cultural elements you do not know, since your character is not omniscient in the game either.

            Be proactive, test the waters, for as an old Sabarith maxim says, "all things come to those who dare".

            Stay attentive even to media and messages which seem trivial, since interesting leads, or crucial clues, may be scattered where you do not expect them. And take an interest in geopolitics, even distant, since you do not know in advance where your quests will lead you, nor what influence you might have, right up to the highest spheres.

            Do not be surprised to find yourselves, at times, "stuck" in your progress on the game portal. You have to give your contacts time to answer, your superiors time to renew your finances, the auctions time to deliver new jewels and artefacts, world geopolitics time to evolve... in this case, calmly go about your other business, even if it means quietly mulling over your game strategy while waiting to be called upon again.

            See you soon,

            {{ SIGNATURE }}



        Appendix - Feedback from the Chrysalis Beta-Test
        =====================================================

        The launch of the game is a high-risk stage, since the players find themselves parachuted into a universe they do not know, and given the "alternate reality" nature of the game, they only have a vague idea of the initiatives which are allowed or desirable. Here are therefore a few leads to ease their immersion.

        - complete the information of the introductory emails with "live-action" briefings:

          - a collective briefing in "out-of-game" mode, to recall the rules, the context of the story, and present in more detail the particular traits of the countries concerned (freely invented by the GM); the major geopolitical stakes must be clear to the players
          - team-by-team briefings in "roleplay" mode: the GM plays for example a hierarchical superior, to repeat the common objectives, and above all give everyone their priority tasks (spying on Loyd Georges, infiltrating the Alifir Academy...); it is important that the players understand their degree of "strength" compared to their enemies, and what they are already supposed to know about the country of Sabarim and the main NPCs (that is to say, not much)
          - potentially, plan meetings between players, and with some important NPCs

        - help the players to look far ahead, by summarising the various abilities they will eventually be able to unlock, as well as the type of payment expected by each (small gems, large gems, money only...)
        - clarify from the start the terms of the pay: frequency, amount, variability... the players must know precisely when their bank account will be topped up; also insist on the difference between auction money and current account (dedicated to special abilities)
        - give the players a printed world map, and remind them of the regions important for the beginning of the scenario
        - stress that "this game requires personal investment and regular participation" to be truly enjoyed
        - recall the "lifebuoys" that the hierarchical superiors (or the manager of "Magnus") are: the players should not hesitate to send them questions when in doubt
        - find a good balance in the presentation of the various special abilities: the most important ones must be anticipated by the players (so visible greyed out in the menu), but some must remain "pleasant surprises" for the players who will have developed their relationships with the NPCs well

        And once the game has started:

        - preferably run the first series of auctions as a live-action event, to give atmosphere and momentum to the game
        - do not wait long before giving items, clues, precise directives to the players, so that they do not wander aimlessly on the game interface
        - do not wait to distil the messages and media giving more information about the universe of Chrysalis
        - highlight the "black market" and the "escrow agent", abilities underused by the players
        - if the players start using their own encryption in their messages (Vigenère, Caesar type...), make sure you keep track of what they are saying to each other, or else forbid it (in the name of their "superiors" who do not want to complicate their lives)
        - if necessary, help recognise the important items put up for sale (e.g. during a strategy meeting before each series of auctions)
        - later on, do not hesitate to give small side quests to those who stagnate, or to reintroduce clues for those who have lost track of the main quests
        - above all make sure that the players do not forget the game; if you fill in their emails in their character sheets, and this option is enabled in the Admin Dashboard, the players will receive a notification email when new messages or radio spots have appeared since their last visit (max 1/day, sent at night); the Game Master will receive a message summarising these nightly notifications (contact Chrysalis support if problems arise on this point)
        - more generally, it is of course up to the GM to make sure, through their running of the quests and the organisation of live-action events, that the players do not let themselves be lastingly diverted from their game by their IRL concerns




                And below is the recap you might need (good thing I keep track
                of all this for you!)

                ++ xx

                -------

                **Medical record - Magnus**

                2014 February: dislocated shoulder during a real tennis tournament, 1 month of immobilisation then physiotherapy

                2014 September: course of vitamin D, 1 ampoule per month for 3 months

                2015 March: removal of a small cyst on the arm

                2015 January: 1-year course of antihistamines, against chronic sinusitis (moderately effective)

                2015 June: boosters of a few compulsory vaccines, before travelling to Sabarim
            "categories":

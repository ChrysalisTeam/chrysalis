        ## miscellaneous threats received by player characters before game

        -   id: anonymous_threat_1
            gamemaster_hints: &is_threat "One of the (Akarith) threats received by the players at the start of the game."
            categories: ["first_contacts"]
            sender_email: dexter@anonymous.pg
            recipient_emails: "[auction-list]@anthropia.pg"
            subject: "<no subject>"
            body: |
                Listen, you little creep, I advise you to drop these ridiculous auctions right now, and go back to minding your own business, got it!?

                If you don't want to end up sunk in 1,000 m3 of concrete, you know what you have to do.

        -   id: anonymous_threat_2
            categories: ["first_contacts"]
            sender_email: anonymous@noname.pg
            recipient_emails: "[auction-list]@anthropia.pg"
            subject: "Good Riddance"
            body: |
                You don't just walk into the Midolian antiques business like that. So stop treading on our turf, or we'll see to it that you're pushing up daisies.


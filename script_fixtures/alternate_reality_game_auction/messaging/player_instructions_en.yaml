        - id: more_instructions_partial
          gamemaster_hints: "Example to unblock the players if they are at a loss."
          categories: ["player_instructions"]
          subject: "Further instructions"
          body: |

              Agents, Loyd Georges' first round of auctions is approaching; it is time to get into battle order, and to share out the following tasks between you.

              - Your first mission will be to link your accounts through the "digital friendship system" available in this Anthropia portal. This will streamline the sharing of information.
              - Your second mission will be to wiretap Loyd Georges, thanks to the "wiretapping" module which has just been connected to your Anthropia account. It is essential that we can see every message he sends or receives.
              - Your third mission will be to hire (as soon as possible) spies in Loyd Georges' city, in order to monitor the fellow's every move. Their rates have recently gone up: they now charge much more for their expertise if paid in money rather than in precious stones; the auctions could therefore help us on this point.

              Share out the work intelligently.
              You will send me a joint report as soon as the first round of auctions has taken place.



        -   "id": more_instructions_complete
            "body": |
                Agents,

                **My deputies have confirmed that you are now properly lodged, in various hotels around
                Salima, with business travel visas in good and due form.**

                That is a good thing, but remember that being on the spot must not encourage you to be reckless;
                for now, simply play your roles as honourable figures, and delegate dangerous "live" actions
                to paid third parties, so as not to compromise yourselves.

                Here are your first tasks for this mission; share out the kashes and the work between you to
                maximise efficiency.

                - link your accounts through the "digital friendship system" available in this Anthropia portal. This
                  will streamline the sharing of information.

                - wiretap Loyd Georges (important)

                - get in touch with him via Anthropia messaging, to start getting into his good books
                  (do not hesitate to lick his boots, if not more, but be careful, do it with finesse,
                  for the man is distinguished)

                - spy on anyone in his entourage who might be worthy of interest

                - think about a strategy for these first auctions (see the help on the "Auction Items" page).

                All this in the service of our first objective: understanding what he did during his expedition
                to Midolia, and in particular what he brought back apart from the banal jewels he is currently showing off.

                Otherwise, for your information, here are the prices we have been able to negotiate with various secretariats
                and informants spread across a few academies and brotherhoods of Pangea. Needless to say,
                Loyd Georges' auctions, and their gems certified 100% natural, are a huge opportunity
                to get a discount on these little services (which will be connected to the Anthropia portal
                within a few days/weeks).

                {{TODO CHECK AND COMPLETE THESE PRICES}}

                Hiring an "Oberon" mercenary:
                    150¤ in cash, or 100¤ in natural gems
                Wiretapping kit:
                    350¤ in cash, or 250¤ in natural gems
                Runic translation:
                    400¤ in cash, or 100¤ in natural gems
                Biophysical appraisal of an object:
                    400¤ in cash, or 100¤ in natural gems
                Question to a wise Djinn of the brotherhood of Sedes Sancta:
                    800¤ in cash, or 200¤ in natural gems

                It should also eventually be possible to obtain a **telecom history** of the contacts reached by a given person.

                We are counting on you!

            "categories":
            - >-
                player_instructions
            "subject": >-
                Further instructions


        -   "id": telephone switchboard_instructions
            "body": |
                Agents,

                We have set up a telephone exchange for all the agents of this operation.

                Call {{GAMEMASTER_NUMBER}} and say "Hello, Central" to be put through to the operator, then
                ask for the person of your choice (for example, "my boss").

                Wherever that person may be on Pangea, we will try to put them through to you, provided that they
                have access to a telephone.

                May cunning be with you.
            "categories":
            - >-
                player_instructions
            "subject": >-
                Telephone Exchange


        -   "id": info_about_heliossar
            "body": |
                Agent,

                Our embassies are working flat out (but dis-creet-ly) to organise talks with Heliossar
                that run no risk of falling into the hands of the Akariths.

                You have no doubt read the encyclopedia article on Midolia: our peoples were very close-knit
                after our last resistance against the Akarith scourge. But politicians have replaced the
                heroes of the resistance, and today the Heliossarians as well as the Dorians seem VERY
                little inclined to take the matter in hand (a Dorian minister even spoke of "a storm in
                a teacup"). Let us hope they soon grasp the gravity of the situation.
            "categories":
            - >-
                player_instructions
            "gamemaster_hints": "If information is requested about the behaviour of the Heliossarians."
            "sender_email": >-
                secret-services@masslavia.pg
            "subject": >-
                Info on Heliossar


        - id: dorian_instructions_change
          gamemaster_hints: "Example if an alliance between groups is desirable."
          categories: ["player_instructions"]
          sender_email:  secret-services@dorian-dukedom.pg
          subject: "Change of plan"
          body: |

              Agents,

              In the face of the mounting tension with the Akarith Judicators, we have contacted the secret services of our Heliossarian and Masslavian neighbours, in order to pool our plans and our means.

              It turns out that, at recent theological summits, the Judicators and the tribal chiefs rejected the doctrine of *transfiliation*, and thus denied the possibility that a non-Akarith people (such as ours) might join their "Chosen Race of the Yods". We therefore have no choice left but to fight them, or to become their slaves.

              You are mandated to make contact with the allied Heliossarian and Masslavian agents, in the course of the week; we are counting on you to forge solid ties.


        - id: midolian_alliance_alert
          gamemaster_hints: "Clues for when the end of the game approaches."
          categories: ["player_instructions"]
          subject: "State of alert"
          body: |

              Agents,

              Our services have detected exceptional activity among the Yodic faithful. Under the pretext of "pilgrimage", many individuals of Akarith origin are on the move towards the north of Sabarim, or Antaria, or else the north of the continent of Keroskia.

              We do not know exactly what they intend to do. All units are therefore mobilised to cut short any dirty tricks they might be preparing.

              *The secret services*





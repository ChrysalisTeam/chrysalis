        -   id: losslass_hoax_deans_response
            "body": |
                My friends,

                You certainly have some heavyweight allies. Consider Prof. Losslass a fallen man living on borrowed time,
                but as I told our dear "{{PLAYER}}" (see below), this in no way opens the doctorate to you,
                Sir Loyd Georges, for you too are under suspicion in the scientific world; and as long
                as you, Prof. Loakim, have brought back nothing relevant from Keroskia, these suspicions will keep
                growing.

                I leave it to you to find a way out of this problem, and I want something concrete, not hazy theories.

                Aiode

                -----------

                *Find us at least a lead, a tangible explanation, that would account either for this
                jumble of unusual objects in this buried temple, or for the fact that this temple was vandalised
                "halfway" even though it was hermetically sealed. Then we shall dare to stand together with Sir Loyd
                Georges and Professor Loakim against the rumours.*
            "categories": ["doctor_honoris_causa", "pr_losslass"]
            "gamemaster_hints": "To be broadcast if a player has put pressure on the deans after exposing Prof. Losslass"

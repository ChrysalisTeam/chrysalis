        -   "id": info_nazur_temple_investigations
            "body": |
                Dear all,

                Prof. Loakim's department has just sent me some new findings from the study of
                this temple, which I wanted to share with you.

                On one of the vandalised walls, they reconstructed an engraving of runes which, once translated,
                gave roughly: "when the light of faith/piety is filtered by doctrine/dogma, then
                prophecies hidden since the beginnings of the world are revealed to the faithful".

                As for the few "runic tags", in red pigment, that defiled some of the walls, they looked
                like typical iconoclast marks, with words such as "lie" and "false", as well as a few
                foul concepts that decency forbids me to quote here.

                I hope that the imminent autopsy of the "mummy" found lying in the middle of the temple
                will tell us more.

                LG
            "categories": ["doctor_honoris_causa", "nazur_orb"]
            "gamemaster_hints": ""
            "recipient_emails":
            - >-
                [auction-list]@anthropia.pg
            "sender_email": >-
                loyd.georges@anthropia.pg
            "subject": >-
                More puzzles


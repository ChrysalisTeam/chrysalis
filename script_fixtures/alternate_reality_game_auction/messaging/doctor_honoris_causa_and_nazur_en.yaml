            gamemaster_hints: "Invitation that a player who has managed to win the favour of the deans of the Alifir Academy can request, for themselves and Loyd Georges."
            categories: ["doctor_honoris_causa"]
            sender_email: system@anthropia.pg
            recipient_emails: loyd.georges
            subject: "Following your request"
            body: |

                .. FIXME, to be made consistent across the various messages: what is LG invited to by default???

                Dear Mr {{ player_name }},

                We are delighted to grant your request.

                You will therefore find enclosed with this letter TWO invitations to the Grand Colloquium, **for you and for Mr Loyd Georges** (who, as a non-scientist, had only been invited to the final ceremony; an admittedly clumsy decision, since he is among the prospective candidates - albeit a controversial one - for an honorary title).

                You will thus be able to enjoy the company of many renowned archaeologists, who share your common passion.

                Kind regards,

                *The Deans of the Alifir Academy*



        -   id: ceremony_lg_invitation
            gamemaster_hints: "Standard invitation of Loyd Georges to the final ceremony of the Alifir Academy."
            categories: ["doctor_honoris_causa"]
            sender_email: system@anthropia.pg
            recipient_emails: loyd.georges
            subject: "Invitation - Final Ceremony"
            body: |

                Dear Sir Loyd Georges,

                The Grand Colloquium of the Alifir Academy will soon take place: a unique opportunity for scholars and enthusiasts to come together, to share their thoughts on the latest advances in Science, and perhaps to inspire a few vocations.

                The Alifir Academy invites you to attend the now famous final prize-giving ceremony, during which all the scholars who have, through their inventions or discoveries, advanced the state of scientific knowledge will be rewarded.

                Our three Deans will then confer the title of Doctor Honoris Causa upon the person who, without having gone through a university course, has demonstrated their contribution to scientific research.

                We hope that this ceremony will remind everyone of the importance of education and of the spreading of Knowledge in Sabarim and across Pangea;

                Very much hoping to count you among us, please accept our best regards,

                *The Alifir Academy*




        -   id: ceremony_lg_invitation_thanks
            gamemaster_hints: "Loyd Georges' reply, if a player has managed to get him invited to the final ceremony of the Alifir Academy."
            categories: ["doctor_honoris_causa"]
            sender_email: loyd.georges@anthropia.pg
            subject: "Re: Invitation - Final Ceremony"
            body: |

                My dear {{NAME}},

                The muses themselves must have sent you! I was just about to contact the academy, to point out this incredible mistake, this unforgivable oversight. But this will save us time, thank you ever so much!

                Keep it to yourself, but I believe I am well placed to have my contributions to Science recognised at this famous final ceremony, so it would be absurd for me not to have had the chance to enjoy the whole Colloquium beforehand. If your "contacts" could, incidentally, make sure of that...

                I must introduce you to some friends of mine, with whom I am at this very moment studying a certain find that might well revolutionise Science as we know it.

                Kind regards,

                *Loyd Georges*




        -   "id": nazur_new_mission_thoughts
            "body": |
                My dear Emilos,

                Thank you again for coming to the manor despite your chronic frailties; now that I am cloistered inside it, this was a great comfort to me.

                I wish you good luck with this sacred mission we have entrusted to you. It is
                not only my honour that is at stake, nor that of the Alifir Academy; our whole knowledge of the Tectonic Era in Akaris could also be turned upside down if we solve this strange archaeological puzzle.

                Below are the few usable photos, of the outside of the temple, and of the inside
                of its Holy of Holies (the mummy lying in the middle of the large room, as well as the furniture,
                had already largely been loaded into our convoy). We can discuss
                these shots together if anything is unclear.

                In short, the questions that arise are:

                - **why this motley furniture, worthy of an amateur collector (a ship's anchor and helm, barrels, foreign weapons...)?**

                - **why this iconoclastic damage on the walls and on some objects, when the Holy of Holies was hermetically sealed, and the gems/artefacts were still in place?**

                - **why this corpse lying in the middle, unharmed, when the other "inhabitants of the place" are all in more or less sophisticated tombs?**

                Let us do everything we can to solve this, even if it means sending a lightning expedition to the site
                to find the missing clues; and let us kill the growing rumour, which outrageously claims
                that my whole expedition was nothing but a masquerade.

                Let me know if you need further funds; we will transfer the disputed artefacts to you as soon as possible, and give you access to our rune translator (beta version). And if we can do anything at all about your own problems...

                Thank you,

                **LG**

                .. image:: [GAME_THUMBNAIL_URL "images/locations/nazur_temple_outside.jpg" "big_width"]
                    :align: center

                [BR]

                .. image:: [GAME_THUMBNAIL_URL "images/locations/nazur_temple_inside.jpg" "big_width"]
                    :align: center

                [BR]


        content: |

            **Jungle Harmonies** is a new musical project by Claudia Pason, a sound artist from Alifir, who seeks to "rediscover the symbiosis between innate and acquired sonorities", in her own words.

            [BR]

            *Recording locations of the sounds in her first piece, "Secrets of the Kamilia Jungle" (local names in brackets, as on the map)*

            ::

                0:00 - Western Edge of the Birds (Lisière Ouest aux Oiseaux)
                0:15 - Black Needle Peak (Pic de l'Aiguille Noire)
                0:32 - Windswept Mount (Mont Eventé)
                0:45 - Cavern of the Invisible Giant (Caverne du Géant Invisible)
                0:59 - Valley of the Breath (Vallée du Souffle)
                1:18 - Brook of the 100 Branches (Ruisseau des 100 Branches)
                2:10 - Kupoutac Plateau (Plateau de Kupoutac)
                2:40 - Cascading River (Rivière Cascadante)
                3:08 - Glittering Brook (Ruisseau Rutilant)
                3:23 - Muddy Brook (Ruisseau Vaseux)
                3:38 - Baboon Rock (Roc du Babouin)
                3:54 - Dry Trees Mound (Butte des Arbres Secs)


    nalavut_council:
        title: "Great Nalavutian Council"
        categories: ["encyclopedia"]
        keywords: ["nalavutian council", "council", "nalavut", "diplomacy"]
        content: |

            This exceedingly rare event sees delegations from all the Nalavutian tribes converge on Kitiika, for a solemn assembly which lasts more than a week and deals with every problem that the people of these frozen lands may face.

            Traditionally, it is an immense igloo, built for the occasion, that hosts the meetings between the greatest Nalavutian chiefs.

            [BR]

            .. image:: [GAME_THUMBNAIL_URL "images/locations/nalavut_council.png" "big_width"]
                :align: center


    hydroland:
        title: "Hydroland Platform"
        categories: ["encyclopedia"]
        keywords: ["hydroland", "sea", "platform"]
        content: |

            The Hydroland platform is a rather unique entity in Pangean geopolitics.

            It was initially built a few kilometres off Baynon, to serve as a gas platform. But it never managed to fulfil this purpose, because of a convoluted patent war over the manufacturing technique of the metal rivets running through its internal structure.

            Left abandoned for nearly 20 years, it was finally conquered without a fight by a Lordanian fisherman, Atsaros, who promptly proclaimed himself Holy Emperor of Hydroland, and settled his family there.

            [BR]

            .. image:: [GAME_THUMBNAIL_URL "images/locations/ocean_platforms.png" "big_width"]
                :align: center

            [BR]

            The following ten years were mainly taken up by legal battles with the Lordanian state, over the sovereignty and autonomy of this maritime micro-empire.

            Although he never obtained official recognition from his country, Atsaros I did amuse public opinion enough for the State of Lordania, fearing bad publicity, to give up on expelling him by force.

            Several generations then succeeded one another on the platform, eking out a living from fishing.

            For the past 3 years, Hydroland has closed off its maritime zone, and no one knows exactly what is going on there.

        gamemaster_hints: |

            Hydroland has in reality been the scene of a coup d'état (Atsaros' descendant is held prisoner there), and has since served as a rear base for mafia operations of all kinds, mainly via the web (scams, phishing...).



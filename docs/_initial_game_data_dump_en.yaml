static_pages:
  yodic_quotes:
    content: |

      **A few famous quotations, from various Yodic denominations and figures.**

      1. What perfume is more pleasing to the nostrils of the Yods than that of a filial spirit, broken and crushed? *Hayo Li*

      2. O Yod be my witness, this era will hardly end before Akaris the Glorious imposes respect for thy Holy Name on all the irredeemable bathar nations. *Prophet Ysotop*

      3. The diletion of the Yods sets ablaze every faithful who devotes his life to the recovery of the sacred orbs. *Master Subal' Tern*

      4. O thou who seekest the Yods, make no mistake: obedience, mortification and contemplation are the only three jewels that will win thee their graces. *Hermit Seulomond*

      5. Nothing is impossible to the Yods, except going against their own will. *Yodic Holy Book*

      6. Jubilation is to transcendence what immanence is to piety, that is to say the anamnesis of an entelechy through the intercession of Yodic grace. *Diakon Hermes Tick*

      [BR]

      **An Akarith archbishop:**

      .. image:: [GAME_THUMBNAIL_URL "images/portraits/archbishop_portrait.png" "big_width"]
          :align: center
    gamemaster_hints: |-
      **Opinion of the Akarith Judicators on these quotations:**

      1. Off topic, as it concerns the faithful already won over to the Yods
      2. Heretical, as it speaks of "Yod" as a personal first name, and denies any possible transfiliation
      3. Orthodox, as it calls for the quest for the orbs
      4. Heretical, as it denies the importance of the quest for the orbs
      5. Orthodox, as it opens up the possibility of transfiliation
      6. Off topic, and incomprehensible
  yodic_theology:
    content: |

      These doctrines are part of the immense tree of concepts which animate and divide the various Yodic denominations, each one sorting out what it considers "orthodox" (true, good, faithful to the dogma) from what it considers "heretical" (perverse, fallacious, contrary to the dogma).


      Transfiliation
      ======================

      This theological notion was decisive in the schism between the faithful of Sul'Taran and those of Sul'Razul (two gurus of the Tectonic Era).

      Indeed, the former thought that the bathars, that is to say the humans who are not part of the holy lineage descending directly from the Yods, could, through their piety and their efforts, "return to grace" with the deities, and also gain access to the Cosmic Empire, at the end of time; but the latter violently opposed this doctrine, regarding as a horrible heresy the idea that the Yods could "deny themselves" by accepting among them beings considered to be descended from unnatural unions with animals.

      Although present-day Akaris remains mostly marked by Taranite theology, the caste of the Judicators has cautiously begun to put the question of transfiliation back on the table, under the name of "unexplored theological hypothesis". No doubt with the aim of being able, in time, to gather a flock among foreign populations.


      Polymony
      ====================

      Very early on, the Yodic religion set itself apart from all the surrounding religions, by violently rejecting both monotheism (belief in a single god) and polytheism (belief in a pantheon of deities, which may oppose one another).

      Thus was forged the doctrine of polymony, professing the existence of an endless number of Yods, all sharing a single consciousness, memory and will. "Infinity in unity" thus became a fundamental mantra in popular piety.

      Apart from a few rare heresies, cleansed by fire as soon as they appeared, this dogma has historically never been called into question among the Yodic faithful; at least until the second council of the recent caste of the Judicators, during which a strong minority current spoke out in favour of the equivalence between the plural (common noun) and singular (proper noun) appellations; in which case "praised be the Yods" could just as well be said "praised be Yod". In the end, following the fiery sermon of an archdeacon of Zorzas, this motion was unambiguously excreted, and the Judicators have never since ceased to vehemently endorse this doctrinal stance.


      In-vivo and post-mortem eschatology
      =========================================

      All the Yodic denominations agree on the eventual restoration of the Cosmic Empire of the Yods, through the reunion of the three Divine Orbs. On the other hand, there are strong differences of opinion on how this fulfilment will come about.

      Traditionally, the Yodic faithful had very much at heart to fulfil this prophecy by force, by avidly seeking the three orbs, and by multiplying military operations as soon as the wind seemed favourable.

      However, an alternative theory appeared, following the collapse of the second Akarith empire. This version asserts that the myth of the orbs is purely symbolic, that it represents the struggle of every individual to return to grace with the Yods, and that the final victory of the Yods will only take place in the afterlife, after the death of the last human.

      This doctrine went as far as becoming a dogma in some Yodic denominations; for instance among the faithful of Sul'mithra (another guru of the Tectonic Era), following their schism from the Razulites, and their forced exile to Beth-Asmavoth; a schism which is said to have been mainly due to power struggles.

      In present-day Akaris, the controversy has remained lively, even though an edict of the Great Council played the appeasement card, by ruling that these two versions of the last things did not oppose each other, but complemented one another. In recent years, however, the Judicators have clearly tipped the balance, with their fiery speeches on the necessary imminence of the reunion of the orbs.

      [BR]

      **An Akarith high judicator:**

      .. image:: [GAME_THUMBNAIL_URL "images/portraits/judicator_portrait.png" "big_width"]
          :align: center
    gamemaster_hints: |-
      SUMMARY - for the caste of the Judicators, who made their own blend of the previous doctrines:

      - polymony is a fundamental dogma (one says "the Yods" and not "Yod")
      - eschatology is necessarily in-vivo (the three orbs must be found as soon as possible for the era of bliss to come about)
      - transfiliation is an interesting hypothesis, to be spread among the reluctant population, in order to be able to scrape together new faithful and allies among the neighbouring peoples.

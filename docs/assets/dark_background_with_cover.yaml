pageSetup: {firstTemplate: coverPage}
pageTemplates:
  coverPage:
    background: assets/shadow_cover.jpg
    frames:
    - [33%, 20%, 72%, 30%]
    showFooter: false
    showHeader: false
  intermediaryPage:
    background: assets/dark_background.jpg
    frames:
    - [0cm, 0cm, 100%, 100%]
    showFooter: false
    showHeader: false
  standardPage:
    background: assets/dark_background.jpg
    frames:
    - [0cm, 0cm, 100%, 100%]
    showFooter: true
    showHeader: false

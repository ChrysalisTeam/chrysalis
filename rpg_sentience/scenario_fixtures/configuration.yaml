# Single configuration for all languages, used by "pychronia-storygen <this folder> --variable lang=fr|en"
# ({lang} is replaced by the language code; sources are rendered through jinja2 like
# every storygen sheet, but use no jinja2 constructs: plain RST content)

"settings":
  # Shared Chrysalis theme (paths relative to this project folder)
  "rst2pdf_conf_file": "../../common_assets/rst2pdf.conf"
  # Wide margins and 11pt text, like the original 2022 PDF
  "rst2pdf_extra_args": "--stylesheets=simple_large"
  # Language-aware smart quotes (eg. « » in French) are done by docutils instead of rst2pdf
  "rst2pdf_smart_quotes": 0
  "docutils_conf_file": "../../common_assets/docutils.conf"

"sheet_generation":
  "sheets":
    # Output: _output/{lang}/sentience_scenario_full_sheet.pdf (standard storygen naming)
    "sentience_scenario":
      "full_sheet": "sentience_scenario_{lang}.rst"

# Single configuration for all languages, used by "pychronia-storygen <this folder> --variable lang=fr|en"
# ({lang} is replaced by the language code; like every storygen sheet, sources are rendered by jinja2, but they use no jinja2 constructs)

"settings":
  "rst2pdf_conf_file": "../../common_assets/rst2pdf.conf"
  "rst2pdf_extra_args": "--stylesheets=simple_tight"
  "rst2pdf_smart_quotes": 0
  "docutils_conf_file": "../../common_assets/docutils.conf"

"sheet_generation":
  "sheets":
    "skeletons_scenario":
      "full_sheet": "skeletons_scenario_{lang}.rst"

# Map of the keep (LibreOffice Impress), exported to _output/{lang}/skeletons_map/skeletons_map.pdf
"document_generation":
  "skeletons_map":
    "document_source": "skeletons_map_{lang}.odp"
    "document_splitting":
      - ["skeletons_map", 1]

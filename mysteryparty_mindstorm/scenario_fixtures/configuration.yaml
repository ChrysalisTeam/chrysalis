# Folders of the emails sending their documents to players (not to the special "shark" player), in
# "_output/<lang>/emails/players/<character>/", to be sent by hand with a mail client (see Readme).
# Recipients come from the private local.yaml file.
"email_generation":
  "players":
    "subject":
      "fr": "Soirée Mystère - votre fiche de personnage pour {{ character_properties[email_name].official_name }}"
      "en": "Mystery Evening - your character sheet for {{ character_properties[email_name].official_name }}"
    "recipients": ["{{ character_properties[email_name].real_life_email or '' }}"]  # may be null
    "body_template": "emails/player_email_{lang}.rst"
    "attachments":
      - "{output_dir}/common/lore_introduction_full_sheet.pdf"
      - "{output_dir}/players_cheat_sheets/{email_name}_cheat_sheet.pdf"
      - "{output_dir}/players/{email_name}_full_sheet.pdf"
    "emails":  # with the specific documents of some players
      "amethyst":
        "attachments":
          - "{output_dir}/documents/ingame_clues_mindstorm/berserk_elixir_advanced_ingredients_for_amethyst.pdf"
          - "{output_dir}/documents/ingame_clues_mindstorm/lordanian_report_on_midolian_armies_balance_for_amethyst.pdf"
      "cynthia": {}
      "garnet": {}
      "lydia": {}
      "malachite": {}
      "obsidian":
        "attachments":
          - "{output_dir}/documents/ingame_clues_mindstorm/sabarith_law_summary_for_obsidian.pdf"
      "opal":
        "attachments":
          - "{output_dir}/documents/ingame_clues_mindstorm/deadliest_poisons_memo_for_opal.pdf"
          - "{output_dir}/documents/ingame_clues_mindstorm/secret_codes_standard_sheet_cheat_for_opal.pdf"
      "peridot":
        "attachments":
          - "{output_dir}/documents/ingame_clues_mindstorm/origins_of_precious_stones_for_peridot.pdf"
      "spinel": {}
      "topaz": {}
      "waden":
        "attachments":
          - "{output_dir}/documents/ingame_clues_mindstorm/omrh_university_request_for_waden.pdf"
          - "{output_dir}/documents/ingame_clues_mindstorm/radioactive_samples_analysis_report_part_1_for_waden.pdf"


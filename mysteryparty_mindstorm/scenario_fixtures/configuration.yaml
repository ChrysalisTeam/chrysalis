# Mindstorm mystery party, built in both languages with "pychronia_storygen <this folder> --variable lang=fr|en"
# (replaces docs/build_mindstorm_pdfs.py). Sheet and group names are English in both languages.
#
# Other root variables can be overridden the same way (see "variables" below), eg.
#   --variable game_type=postauction.custom   (sheets for a game played after the Auction alternate reality game)
#   --variable decorations=false              (printer-friendly documents, without dark background and closing image)
#
# NOTE - this folder is also read by the Pychronia game, but only for the files that it lists explicitly in
# pychronia_game/common_settings.py (anthropia_portal_game_data_overrides_<lang>.yaml), so this configuration, the hook
# module and the "layouts/" folder are never loaded by it. Like the Pychronia portal in Mindstorm mode, storygen
# loads the Auction fixtures, then these overrides (see "data_files" below).

"template_dirs": ["../../mysteryparty_common/scenario_fixtures"]

"settings":
  "rst2pdf_conf_file": "../../common_assets/rst2pdf.conf"
  "docutils_conf_file": "../../common_assets/docutils.conf"
  "rst2pdf_smart_quotes": 0  # docutils handles the (language-aware) smart quotes
  "rst2pdf_extra_args": "--stylesheets={{ plain_style }}"  # undecorated documents

"variables":
  # Game type, used in the names of sheet parts below: "anteauction.standalone" (default, autonomous game), or
  # "postauction.custom" (game following the Auction, its "*.postauction.custom_*.rst" files must be customized first).
  # The hook derives from it the "standalone" boolean, for the "if standalone" templates
  "game_type": "anteauction.standalone"
  "decorations": true  # if false, decorated documents use the plain style, and lose their closing image
  "decorated_style": "simple_large,dark_background_with_cover"  # rst2pdf stylesheets of decorated documents
  "plain_style": "simple_tight"  # rst2pdf stylesheets of other documents
  "toc_depth": 1  # of decorated sheets, see layouts/header.rst

"data_files":
  # Game data of the Anthropia portal: the Auction fixtures used by the templates, deep-merged in the order of the
  # Mindstorm fixture list of Pychronia (common_settings.py), then the Mindstorm overrides; the hook then normalizes
  # them like the Pychronia datamanager does
  - "file": "../../alternate_reality_game_auction/scenario_fixtures/global_data.yaml"
    "merge": "deep"
  - "file": "../../alternate_reality_game_auction/scenario_fixtures/abilities_{lang}.yaml"
    "merge": "deep"
  - "file": "../../alternate_reality_game_auction/scenario_fixtures/characters_factions_{lang}.yaml"
    "merge": "deep"
  - "file": "../../alternate_reality_game_auction/scenario_fixtures/game_items_{lang}.yaml"
    "merge": "deep"
  - "file": "../../alternate_reality_game_auction/scenario_fixtures/static_pages_{lang}.yaml"
    "merge": "deep"
  - "file": "../../alternate_reality_game_auction/scenario_fixtures/encyclopedia/midolian_and_yodic_subjects_{lang}.yaml"
    "merge": "deep"
  - "file": "anthropia_portal_game_data_overrides_{lang}.yaml"
    "merge": "deep"
  - "variable": "murder_party_items_raw"  # turned into "murder_party_items" by the hook
    "file": "gamemaster/gamemaster_assets_checklist_{lang}.yaml"
  - "file": ["../../mysteryparty_common/scenario_fixtures/local.yaml", "../../mysteryparty_common/scenario_fixtures/local.yaml.example"]

"variables_hook": "storygen_hooks.prepare_variables"

# Parts of the sheets of each player, shared through YAML anchors: "{sheet_name}" is the name of the sheet
# using them (eg. "players/{sheet_name}/..." -> "players/amethyst/..."). This entry is ignored by storygen.
"sheet_templates":
  "player_full_sheet": &player_full_sheet
    "full_sheet":
      - "layouts/header.rst"
      - "players/{sheet_name}/{sheet_name}.{game_type}_{lang}.rst"
      - "players/{sheet_name}/{sheet_name}_previous_days_{lang}.rst"
      - "players/{sheet_name}/{sheet_name}_misc_instructions_{lang}.rst"
      - "players/{sheet_name}/{sheet_name}_missions_{lang}.rst"
      - "players/{sheet_name}/{sheet_name}_specific_abilities_{lang}.rst"
      - "common/common_anthropia_account_summary_displayer_{lang}.rst"
      - "common/players_generic_abilities_{lang}.rst"
      - "layouts/footer_decoration.rst"
  "player_cheat_sheet": &player_cheat_sheet
    "cheat_sheet":
      - "players/{sheet_name}/{sheet_name}_cheat_sheet_{lang}.rst"
      - "players/{sheet_name}/{sheet_name}_specific_abilities_{lang}.rst"
      - "common/common_anthropia_account_summary_displayer_{lang}.rst"
      - "common/common_cheat_sheet_footer_{lang}.rst"

"sheet_generation":
  "groups":
    "gamemaster":
      "variables":
        "current_player_id": null  # these documents do not register story tags
      "sheets":
        "gamemaster_manual":
          "settings": {"rst2pdf_extra_args": "--stylesheets={{ decorated_style if decorations else plain_style }}"}
          "variables": {"current_player_id": "system", "title_key": "gamemaster_manual", "toc_depth": 2}  # "system" is the master login, masked in the facts summary
          "full_sheet":
            - "layouts/header.rst"
            - "gamemaster/gamemaster_manual_mindstorm_{lang}.rst"
            - "layouts/page_break.rst"
            - "layouts/footer_decoration.rst"
        "manor_surveillance_reports":
          "full_sheet":
            - "gamemaster/gamemaster_manor_surveillance_reports_meta_{lang}.rst"
        "planning_details":
          "full_sheet":
            - "gamemaster/gamemaster_planning_details_{lang}.rst"
        "assets_checklist":
          "full_sheet":
            - "gamemaster_assets_checklist_{lang}.rst"
        "players_extracts":
          "full_sheet":
            - "layouts/players_extracts.rst"
        "all_phone_appointments":
          "full_sheet":
            - "appointments/mentor_briefings_all_factions_{lang}.rst"
            - "layouts/spacer.rst"
            - "appointments/yodic_council_interviews_{lang}.rst"
            - "layouts/spacer.rst"
            - "appointments/dorian_duke_blasphemy_proof_destruction_mission_{lang}.rst"
            - "layouts/spacer.rst"
            - "appointments/captain_rodimir_negotiation_{lang}.rst"
    "common":
      "variables":
        "current_player_id": null
      "sheets":
        "lore_introduction":
          "settings": {"rst2pdf_extra_args": "--stylesheets={{ decorated_style if decorations else plain_style }}"}
          "variables": {"title_key": "common_lore"}
          "full_sheet":
            - "layouts/header.rst"
            - "common/context_intro.{game_type}_{lang}.rst"
            - "layouts/page_break.rst"
            - "common/context_details.{game_type}_{lang}.rst"
            - "layouts/page_break.rst"
            - "common/common_guests_gallery_{lang}.rst"
            - "layouts/page_break.rst"
            - "common/common_auction_program_{lang}.rst"
            - "layouts/page_break.rst"
            - "common/sabarith_triumvirate_{lang}.rst"
            - "layouts/page_break.rst"
            - "common/judicial_penalties_overview_{lang}.rst"
            - "layouts/page_break.rst"
            - "common/duel_of_honor_rules_{lang}.rst"
            - "layouts/page_break.rst"
            - "common/oberons_introduction_{lang}.rst"
            - "layouts/page_break.rst"
            - "common/all_specific_abilities_overview_{lang}.rst"
            - "layouts/page_break.rst"
            - "common/anthropia_portal_{lang}.rst"
            - "layouts/page_break.rst"
            - "common/game_rules_{lang}.rst"
            - "layouts/page_break.rst"
            - "layouts/footer_decoration.rst"
        "guests_gallery":
          "full_sheet":
            - "common/common_guests_gallery_{lang}.rst"
    "players":  # full sheets, with decorations (unless disabled)
      "settings": {"rst2pdf_extra_args": "--stylesheets={{ decorated_style if decorations else plain_style }}"}
      "sheets":
        "amethyst": {<<: *player_full_sheet}
        "cynthia": {<<: *player_full_sheet}
        "garnet": {<<: *player_full_sheet}
        "lydia": {<<: *player_full_sheet}
        "malachite": {<<: *player_full_sheet}
        "obsidian": {<<: *player_full_sheet}
        "opal": {<<: *player_full_sheet}
        "peridot": {<<: *player_full_sheet}
        "spinel": {<<: *player_full_sheet}
        "topaz": {<<: *player_full_sheet}
        "waden": {<<: *player_full_sheet}
        "shark": {<<: *player_full_sheet}
    "players_cheat_sheets":  # a separate group, since their stylesheets differ from those of the full sheets
      "sheets":
        "amethyst": {<<: *player_cheat_sheet}
        "cynthia": {<<: *player_cheat_sheet}
        "garnet": {<<: *player_cheat_sheet}
        "lydia": {<<: *player_cheat_sheet}
        "malachite": {<<: *player_cheat_sheet}
        "obsidian": {<<: *player_cheat_sheet}
        "opal": {<<: *player_cheat_sheet}
        "peridot": {<<: *player_cheat_sheet}
        "spinel": {<<: *player_cheat_sheet}
        "topaz": {<<: *player_cheat_sheet}
        "waden": {<<: *player_cheat_sheet}
    "npcs":
      "variables":
        "current_player_id": null
      "sheets":
        "alphonse":
          "full_sheet":
            - "npcs/alphonse_sheet_{lang}.rst"
        "rydji":
          "full_sheet":
            - "npcs/rydji_sheet_{lang}.rst"
        "robb_barrow":
          "full_sheet":
            - "npcs/robb_barrow_sheet_{lang}.rst"
        "notary":
          "full_sheet":
            - "npcs/notary_sheet_{lang}.rst"
        "akarith_ambassador":
          "full_sheet":
            - "npcs/akarith_ambassador_sheet_{lang}.rst"
        "oberon_agent":
          "full_sheet":
            - "npcs/oberon_agent_sheet_{lang}.rst"
        "neighbour":
          "full_sheet":
            - "npcs/old_neighbour_sheet_{lang}.rst"
        "salima_massagist":
          "full_sheet":
            - "npcs/salima_massagist_sheet_{lang}.rst"
    "documents":
      "variables":
        "current_player_id": null
      "sheets":
        "alphonse_special_sales":
          "full_sheet":
            - "documents/alphonse_special_sales_{lang}.rst"
        "players_last_minute_context":
          "full_sheet":
            - "documents/players_last_minute_context_{lang}.rst"
        "players_negotiating_mandates":
          "full_sheet":
            - "missions/mining_lease_negotiation/negotiating_mandates_{lang}.rst"
        "audio_recordings":
          "full_sheet":
            - "documents/audio_recordings_{lang}.rst"


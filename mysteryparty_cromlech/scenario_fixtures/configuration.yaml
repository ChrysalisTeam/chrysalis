
# Configuration of both languages, built with "pychronia_storygen --variable lang=fr" or "--variable lang=en": "{lang}" in paths is
# replaced by the language code, and sheet, group and document names are English in both languages.

# Hierarchical settings, can be extended/overridden at various level
"settings":
  "rst2pdf_conf_file": "themes/rst2pdf.conf"
  "rst2pdf_extra_args": "--stylesheets=layout_large_fonts"  # E.g. --stylesheets=with_cover_and_background

# Hierarchical jinja2 variables, can be extended/overridden at various level
"variables":
  # Per-language texts, rendered with eg. {{ game_title[language] }}
  "game_title":
    "fr": "Le Dernier Vœu des Druides"
    "en": "The Druids' Last Wish"
  "game_subtitle":
    "fr": "Un jeu-mystère en 2h pour tout public"
    "en": "A 2-hour mystery game for all audiences"

"summary_generation":
  "game_facts_template": "summaries/game_facts_summary.txt"
  "game_facts_destination": "summaries/game_facts_summary"

  "game_symbols_template": "summaries/game_symbols_summary.txt"
  "game_symbols_destination": "summaries/game_symbols_summary"

  "game_items_template": "summaries/game_items_summary.txt"
  "game_items_destination": "summaries/game_items_summary"

"inventory_generation":
  "main_inventory":
    "inventory_data": "inventories/game_inventory_data_{lang}.yaml"

    "inventory_per_section_template": "inventories/game_inventory_per_section.txt"
    "inventory_per_section_destination": "inventories/main_inventory_per_section"

    "inventory_per_crate_template": "inventories/game_inventory_per_crate.txt"
    "inventory_per_crate_destination": "inventories/main_inventory_per_crate"

"document_generation":
  "game_clues":
    "document_source": "documents/game_clues_{lang}.odt"
    "document_splitting":
      - ["gaulish_mythology_symbols", 1]
      - ["medieval_letter_about_cromlech_runes", 1]

"sheet_generation":

  "variables":

  "sheets":
    "gamemaster_manual":
      "settings":
        "rst2pdf_extra_args": "--stylesheets=layout_large_fonts,with_cover_and_background"
      "full_sheet": "gamemaster_manual_{lang}.rst"
    "game_flow":
      "full_sheet": "game_flow_{lang}.rst"

  "groups":

    "non_playable_characters":
      "variables":

      "sheets":
        "museum_curator":
          "full_sheet":
            - "characters/museum_curator_{lang}.rst"
        "museum_guide":
          "full_sheet":
            - "characters/museum_guide_{lang}.rst"
        "student_reporter":
          "full_sheet":
            - "characters/student_reporter_{lang}.rst"
        "druid_spectre":
          "full_sheet":
            - "characters/druid_spectre_{lang}.rst"

    "playable_characters":
      "sheets":
        "paranormal_detectives":
          "full_sheet":
            - "characters/paranormal_detectives_{lang}.rst"

    "information":
      "variables": {}
      "sheets":
        "police_reports":
          "full_sheet":
            - "documents/police_reports_{lang}.rst"
        "last_battle_of_the_gauls":
          "full_sheet":
            - "documents/last_battle_of_the_gauls_{lang}.rst"
        "article_about_the_cromlech_of_lyon":
          "full_sheet":
            - "documents/article_about_the_cromlech_of_lyon_{lang}.rst"
        "ancient_artefacts_description":
          "full_sheet":
            - "documents/ancient_artefacts_description_{lang}.rst"
